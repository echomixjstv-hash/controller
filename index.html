<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Quiz Remote Controller</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
padding:0;
min-height:100%;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
}

#app{
width:100%;
max-width:560px;
min-height:100vh;
padding:20px;
display:flex;
align-items:center;
justify-content:center;
}

.screen{
display:none;
width:100%;
text-align:center;
align-items:center;
flex-direction:column;
gap:18px;
}

.screen.active{
display:flex;
}

h1{
margin:0;
font-size:30px;
}

.room{
font-size:20px;
opacity:.75;
}

input{
width:100%;
max-width:400px;
padding:18px;
border:0;
border-radius:14px;
font-size:24px;
text-align:center;
outline:none;
}

button{
font-family:inherit;
border:0;
cursor:pointer;
}

.enter{
width:100%;
max-width:400px;
padding:18px;
border-radius:14px;
background:#2196f3;
color:#fff;
font-size:22px;
font-weight:bold;
}

.players{
display:flex;
gap:18px;
justify-content:center;
width:100%;
}

.playerPick{
width:145px;
height:145px;
border-radius:50%;
background:#4caf50;
color:#fff;
font-size:20px;
font-weight:bold;
}

.playerPick:active,
.buzzer:active,
.answer:active{
transform:scale(.95);
}

.playerPick:disabled{
opacity:.35;
cursor:not-allowed;
}

.buzzer{
position:relative;
width:min(72vw,320px);
height:min(72vw,320px);
border-radius:50%;
background:#4caf50;
color:#fff;
font-size:30px;
font-weight:bold;
box-shadow:0 10px 35px #0008;
}

.buzzer.yellow{
background:#ffd600;
color:#111;
animation:blink .55s infinite;
}

.buzzer.red{
background:#e53935;
color:#fff;
cursor:not-allowed;
}

.buzzer.red:after{
content:"✕";
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:145px;
font-weight:900;
}

.buzzer.waiting{
background:#555;
color:#bbb;
cursor:not-allowed;
box-shadow:none;
}

@keyframes blink{
0%,100%{opacity:1}
50%{opacity:.28}
}

.status{
min-height:28px;
font-size:20px;
font-weight:bold;
}

.attempt{
font-size:17px;
opacity:.8;
}


/* =========================
   ANSWERS
========================= */

.answers{
width:100%;
max-width:400px;
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin:0 auto;
}

.answers.hidden{
display:none!important;
}

.answer{
height:100px;
border-radius:16px;
color:#fff;
font-size:40px;
font-weight:bold;
}

.a{
background:#e53935;
}

.b{
background:#1e88e5;
}

.c{
background:#fbc02d;
color:#111;
}

.d{
background:#8e24aa;
}

.answer.selected{
outline:6px solid #fff;
outline-offset:-6px;
}

.answer:disabled{
opacity:.45;
cursor:not-allowed;
}


/* =========================
   MESSAGES
========================= */

.error{
color:#ff8a80;
min-height:25px;
font-size:17px;
font-weight:bold;
}

.note{
font-size:14px;
opacity:.6;
max-width:390px;
}

.leave{
padding:12px 22px;
border-radius:10px;
background:#444;
color:#fff;
font-size:16px;
}

.hidden{
display:none!important;
}

</style>
</head>

<body>

<div id="app">


<!-- =====================================================
     ROOM SCREEN
===================================================== -->

<section id="roomScreen" class="screen active">

<h1>ENTER ROOM NUMBER</h1>

<input
id="roomInput"
inputmode="numeric"
maxlength="20"
placeholder="Room Number"
autocomplete="off">

<button id="enterBtn" class="enter">
ENTER ROOM
</button>

<div id="roomError" class="error"></div>

<div class="note">
Enter the same room number used by the host.
</div>

</section>


<!-- =====================================================
     PLAYER SCREEN
===================================================== -->

<section id="playerScreen" class="screen">

<h1>SELECT PLAYER</h1>

<div id="playerRoom" class="room"></div>

<div class="players">

<button id="p1" class="playerPick">
PLAYER 1
</button>

<button id="p2" class="playerPick">
PLAYER 2
</button>

</div>

<div id="playerError" class="error"></div>

</section>


<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section id="gameScreen" class="screen">

<div id="gameRoom" class="room"></div>

<div id="attempt" class="attempt">
ATTEMPT 1 OF 3
</div>

<button id="buzzer" class="buzzer waiting">
WAITING
</button>

<div id="status" class="status">
WAITING FOR QUESTION
</div>


<!-- ANSWERS -->

<div id="answers" class="answers hidden">

<button class="answer a" data-answer="A">
A
</button>

<button class="answer b" data-answer="B">
B
</button>

<button class="answer c" data-answer="C">
C
</button>

<button class="answer d" data-answer="D">
D
</button>

</div>


<button id="leaveBtn" class="leave">
LEAVE ROOM
</button>

</section>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

apiKey:"AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",

authDomain:"jess-santi.firebaseapp.com",

databaseURL:"https://jess-santi-default-rtdb.firebaseio.com/",

projectId:"jess-santi",

storageBucket:"jess-santi.firebasestorage.app",

messagingSenderId:"457562056307",

appId:"1:457562056307:web:1be6c76bc8bdb5bd0aac06",

measurementId:"G-SKL83F8C8B"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


/* =====================================================
   AUDIO
===================================================== */

const firstSound=
new Audio("sound.mp3");

const lateSound=
new Audio("better-luck-next-time.mp3");

firstSound.preload="auto";
lateSound.preload="auto";


/* =====================================================
   VARIABLES
===================================================== */

let room="";
let player="";

let roomRef=null;
let playerRef=null;

let currentRound=null;
let currentAttempt=1;

let joined=false;

let localBuzz=false;
let answerSent=false;

let allowedPlayer=null;

let questionReady=false;
let currentPhase="WAITING";

let roomWatcherStarted=false;


/* =====================================================
   ELEMENT SHORTCUT
===================================================== */

const $=id=>
document.getElementById(id);


/* =====================================================
   SCREEN
===================================================== */

function show(el){

[
$("roomScreen"),
$("playerScreen"),
$("gameScreen")
].forEach(x=>{
x.classList.remove("active");
});

el.classList.add("active");

}


/* =====================================================
   SOUND
===================================================== */

function sound(audio){

try{

audio.currentTime=0;

audio.play().catch(()=>{});

}catch(e){}

}


/* =====================================================
   ANSWER BUTTONS
===================================================== */

function setAnswerButtons(on){

document
.querySelectorAll(".answer")
.forEach(button=>{

button.disabled=!on;

});

}


function clearAnswerSelection(){

document
.querySelectorAll(".answer")
.forEach(button=>{

button.classList.remove("selected");

});

}


/* =====================================================
   HIDE ANSWERS
===================================================== */

function hideAnswers(){

$("answers").classList.add("hidden");

setAnswerButtons(false);

clearAnswerSelection();

}


/* =====================================================
   WAITING
===================================================== */

function waitingForQuestion(){

questionReady=false;

localBuzz=false;

answerSent=false;

$("buzzer").className="buzzer waiting";

$("buzzer").textContent="WAITING";

$("status").textContent=
"WAITING FOR QUESTION";

hideAnswers();

}


/* =====================================================
   READY
===================================================== */

function ready(){

/*
   HUWAG MAG-READY KUNG
   WALA PA ANG TANONG.
*/

if(!questionReady){

waitingForQuestion();

return;

}

$("buzzer").className="buzzer";

$("buzzer").textContent=
player==="player1"
?"PLAYER 1"
:"PLAYER 2";

$("status").textContent="READY";

$("attempt").textContent=
"ATTEMPT "+currentAttempt+" OF 3";

/*
   Choices hidden muna.
   Lalabas lamang kapag
   siya ang unang nakapag-buzz.
*/

hideAnswers();

localBuzz=false;

answerSent=false;

}


/* =====================================================
   FIRST BUZZ
===================================================== */

function winner(){

if(!questionReady){

waitingForQuestion();

return;

}

$("buzzer").className=
"buzzer yellow";

$("status").textContent=
"FIRST TO BUZZ";

$("answers").classList.remove("hidden");

setAnswerButtons(true);

localBuzz=true;

sound(firstSound);

}


/* =====================================================
   TOO LATE
===================================================== */

function loser(){

$("buzzer").className=
"buzzer red";

$("status").textContent=
"TOO LATE";

hideAnswers();

localBuzz=false;

answerSent=false;

sound(lateSound);

}


/* =====================================================
   DISABLED
===================================================== */

function disabled(){

$("buzzer").className=
"buzzer red";

$("status").textContent=
"DISABLED";

hideAnswers();

localBuzz=false;

answerSent=false;

}


/* =====================================================
   STEAL READY
===================================================== */

function stealReady(){

if(!questionReady){

waitingForQuestion();

return;

}

$("buzzer").className=
"buzzer";

$("buzzer").textContent=
player==="player1"
?"PLAYER 1"
:"PLAYER 2";

$("status").textContent=
"STEAL • READY";

$("attempt").textContent=
"ATTEMPT "+currentAttempt+" OF 3";

/*
   STEAL = choices ACTIVE
*/

$("answers").classList.remove("hidden");

setAnswerButtons(true);

clearAnswerSelection();

localBuzz=true;

answerSent=false;

}


/* =====================================================
   ROOM ERROR
===================================================== */

function roomNotFound(){

$("roomError").textContent=
"ROOM NOT FOUND";

}


/* =====================================================
   ENTER ROOM
===================================================== */

$("enterBtn").onclick=async()=>{

const value=
$("roomInput").value.trim();

$("roomError").textContent="";

if(!value){

$("roomError").textContent=
"Enter a room number.";

return;

}


/*
   IMPORTANT:
   HINDI GUMAGAWA NG ROOM.
*/

room=value;

roomRef=
db.ref("rooms/"+room);


try{

const snap=
await roomRef.child("round").once("value");


/*
   NON-EXISTING ROOM
*/

if(!snap.exists()){

roomNotFound();

roomRef=null;

return;

}


/*
   VALID ROOM
*/

$("playerRoom").textContent=
"ROOM "+room;

$("p1").disabled=false;
$("p2").disabled=false;

show($("playerScreen"));

watchRoom();

}catch(e){

console.error(e);

$("roomError").textContent=
"Unable to check room.";

}

};


/* =====================================================
   WATCH ROOM
===================================================== */

function watchRoom(){

if(roomWatcherStarted)return;

roomWatcherStarted=true;


/* =====================================================
   ROUND
===================================================== */

roomRef.child("round").on("value",snap=>{

const value=snap.val();

if(value===null)return;

if(currentRound!==value){

currentRound=value;

currentAttempt=1;

allowedPlayer=null;

questionReady=false;

currentPhase="WAITING";

if(joined){

waitingForQuestion();

}

}

});


/* =====================================================
   STATE
===================================================== */

roomRef.child("state").on("value",snap=>{

const state=snap.val();

if(!state)return;


/*
   Ignore old question
*/

if(
currentRound!==null &&
state.round!==currentRound
){

return;

}


currentPhase=
state.phase||"WAITING";

currentAttempt=
Number(state.attempt)||1;

allowedPlayer=
state.allowedPlayer||null;


/*
   NEW IMPORTANT FIELD
*/

questionReady=
state.questionReady===true;


/*
   If state is QUIZ FINISHED
*/

if(
state.phase==="QUIZ_FINISHED" ||
state.phase==="FINISHED"
){

hideAnswers();

$("buzzer").className=
"buzzer red";

$("status").textContent=
"QUIZ FINISHED";

localBuzz=false;
answerSent=false;

return;

}


/*
   No question yet
*/

if(
state.phase==="WAITING" ||
!questionReady
){

waitingForQuestion();

return;

}


/*
   READY
*/

if(
state.phase==="READY"
){

if(
allowedPlayer &&
allowedPlayer!==player
){

if(joined){

disabled();

}

}else{

if(joined){

ready();

}

}

return;

}


/*
   STEAL
*/

if(
state.phase==="STEAL"
){

if(!joined)return;

if(
allowedPlayer===player
){

stealReady();

}else{

disabled();

}

return;

}


/*
   ANSWERED
*/

if(
state.phase==="ANSWERED"
){

hideAnswers();

localBuzz=false;

answerSent=false;


/*
   CORRECT
   → READY
*/

if(state.correct===true){

$("status").textContent=
"CORRECT";


setTimeout(()=>{

if(
joined &&
questionReady &&
currentRound===state.round
){

ready();

}

},300);

}else{

if(state.player===player){

$("status").textContent=
"WRONG";

}else{

$("status").textContent=
"WRONG ANSWER";

}

}

return;

}

});


/* =====================================================
   BUZZER
===================================================== */

roomRef.child("buzzer").on("value",snap=>{

if(!joined)return;

const data=snap.val();


/*
   Walang buzzer
*/

if(!data){

if(
questionReady &&
currentPhase==="READY" &&
!allowedPlayer
){

ready();

}

return;

}


/*
   Old round
*/

if(
data.round!==currentRound
){

return;

}


/*
   Kung hindi active question
*/

if(!questionReady){

waitingForQuestion();

return;

}


/*
   PLAYER 1 / PLAYER 2
*/

if(data.player===player){

winner();

}else{

/*
   May ibang player na
   unang nakapindot.
*/

loser();

}

});


/* =====================================================
   ATTEMPT
===================================================== */

roomRef.child("attempt").on("value",snap=>{

const value=snap.val();

if(value!==null){

currentAttempt=
Number(value)||1;

$("attempt").textContent=
"ATTEMPT "+currentAttempt+" OF 3";

}

});

}


/* =====================================================
   JOIN PLAYER
===================================================== */

async function join(which){

$("playerError").textContent="";

if(!roomRef){

$("playerError").textContent=
"Invalid room.";

return;

}

player=which;

playerRef=
roomRef.child("players/"+player);


try{

/*
   Check room AGAIN before joining.
*/

const roomCheck=
await roomRef.child("round").once("value");

if(!roomCheck.exists()){

$("playerError").textContent=
"ROOM NOT FOUND";

return;

}


/*
   Check player slot.
*/

const result=
await playerRef.transaction(value=>{

if(value===null){

return{

joined:true,

at:
firebase.database.ServerValue.TIMESTAMP

};

}

return;

});


if(!result.committed){

$("playerError").textContent=
"That player slot is already occupied.";

return;

}


joined=true;

playerRef.onDisconnect().remove();


/*
   Get current round
*/

currentRound=
roomCheck.val()||1;


/*
   Display room
*/

$("gameRoom").textContent=
"ROOM "+room+
" • "+
(player==="player1"
?"PLAYER 1"
:"PLAYER 2");


/*
   Get current state
*/

const stateSnap=
await roomRef.child("state").once("value");


if(stateSnap.exists()){

const state=
stateSnap.val();


if(
state.round===currentRound
){

currentAttempt=
Number(state.attempt)||1;

allowedPlayer=
state.allowedPlayer||null;

questionReady=
state.questionReady===true;

currentPhase=
state.phase||"WAITING";

}

}


/*
   Display proper state
*/

if(!questionReady){

waitingForQuestion();

}else if(
currentPhase==="STEAL" &&
allowedPlayer===player
){

stealReady();

}else if(
allowedPlayer &&
allowedPlayer!==player
){

disabled();

}else if(
currentPhase==="READY"
){

ready();

}else{

waitingForQuestion();

}


show($("gameScreen"));

}catch(e){

console.error(e);

$("playerError").textContent=
"Unable to join this player slot.";

}

}


/* =====================================================
   PLAYER BUTTONS
===================================================== */

$("p1").onclick=
()=>join("player1");

$("p2").onclick=
()=>join("player2");


/* =====================================================
   BUZZER CLICK
===================================================== */

$("buzzer").onclick=async()=>{

if(!joined)return;


/*
   WALANG ACTIVE QUESTION
*/

if(!questionReady){

waitingForQuestion();

return;

}


/*
   Hindi siya ang allowed player
*/

if(
allowedPlayer &&
allowedPlayer!==player
){

return;

}


/*
   Disabled / waiting
*/

if(
$("buzzer").classList.contains("red") ||
$("buzzer").classList.contains("waiting")
){

return;

}


/*
   Already yellow
*/

if(
$("buzzer").classList.contains("yellow")
){

return;

}


try{

const buzzerRef=
roomRef.child("buzzer");


const result=
await buzzerRef.transaction(value=>{

/*
   FIRST PLAYER
*/

if(value===null){

return{

player:player,

round:currentRound,

attempt:currentAttempt,

at:
firebase.database.ServerValue.TIMESTAMP

};

}


/*
   May naunang pumindot
*/

return;

});


if(result.committed){

winner();

}else{

loser();

}

}catch(e){

console.error(e);

$("status").textContent=
"CONNECTION ERROR";

}

};


/* =====================================================
   ANSWERS
===================================================== */

document
.querySelectorAll(".answer")
.forEach(button=>{

button.onclick=async()=>{

if(!joined)return;

if(!questionReady)return;

if(!localBuzz)return;

if(answerSent)return;


/*
   Only active yellow/steal
*/

if(
!$("buzzer").classList.contains("yellow") &&
$("status").textContent!=="STEAL • READY"
){

return;

}


answerSent=true;

const answer=
button.dataset.answer;


try{

await roomRef.child("answer").set({

player:player,

round:currentRound,

attempt:currentAttempt,

answer:answer,

at:
firebase.database.ServerValue.TIMESTAMP

});


clearAnswerSelection();

button.classList.add("selected");

$("status").textContent=
"ANSWER SENT: "+answer;


/*
   Hide choices after selecting
*/

$("answers").classList.add("hidden");

setAnswerButtons(false);

localBuzz=false;

}catch(e){

console.error(e);

answerSent=false;

$("status").textContent=
"CONNECTION ERROR";

}

};

});


/* =====================================================
   LEAVE
===================================================== */

$("leaveBtn").onclick=async()=>{

try{

if(playerRef){

await playerRef.remove();

}

}catch(e){}

location.reload();

};


/* =====================================================
   CLOSE
===================================================== */

window.addEventListener(
"beforeunload",
()=>{

if(playerRef){

playerRef.remove().catch(()=>{});

}

});


/* =====================================================
   ENTER KEY
===================================================== */

$("roomInput").addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

$("enterBtn").click();

}

});

</script>

</body>
</html>
