<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team Quiz Remote</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.wrap{
    width:min(720px,96vw);
    height:min(900px,96vh);
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px;
}

h1{
    margin:0;
    text-align:center;
    font-size:clamp(22px,6vw,38px);
}

.connection{
    display:flex;
    gap:8px;
}

#room{
    flex:1;
    min-width:0;
    border:0;
    border-radius:10px;
    padding:13px;
    font-size:18px;
    text-align:center;
}

#connect{
    border:0;
    border-radius:10px;
    padding:0 16px;
    background:#3498db;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.status{
    min-height:22px;
    text-align:center;
    font-size:14px;
    color:#f1c40f;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    flex:1;
}

button.remote{
    border:0;
    border-radius:18px;
    color:white;
    font-size:clamp(34px,10vw,70px);
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
    box-shadow:0 5px 0 #000;
    transition:transform .06s,opacity .1s;
}

button.remote:active{
    transform:translateY(5px);
    box-shadow:0 0 0 #000;
}

button.remote:disabled{
    opacity:.25;
    pointer-events:none;
}

.team1{background:#1769ff}
.team2{background:#e74c3c}
.choice{background:#333}

@media(max-width:450px){
    .wrap{
        width:100%;
        height:100%;
        padding:8px;
        gap:8px;
    }

    button.remote{
        border-radius:14px;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <h1>🏆 TEAM QUIZ REMOTE</h1>

    <div class="connection">
        <input id="room"
               inputmode="numeric"
               autocomplete="off"
               placeholder="Room #">

        <button id="connect">CONNECT</button>
    </div>

    <div id="status" class="status">
        Enter the same Room # as the quiz.
    </div>

    <div class="row">
        <button class="remote team1" data-command="TEAM1" disabled>TEAM 1</button>
        <button class="remote team2" data-command="TEAM2" disabled>TEAM 2</button>
    </div>

    <div class="row">
        <button class="remote choice" data-command="A" disabled>A</button>
        <button class="remote choice" data-command="B" disabled>B</button>
    </div>

    <div class="row">
        <button class="remote choice" data-command="C" disabled>C</button>
        <button class="remote choice" data-command="D" disabled>D</button>
    </div>

</div>

<audio id="pressSound" preload="auto">
    <source src="sound.mp3" type="audio/mpeg">
</audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
    apiKey:"AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",
    authDomain:"jess-santi.firebaseapp.com",
    databaseURL:"https://jess-santi-default-rtdb.firebaseio.com/",
    projectId:"jess-santi",
    storageBucket:"jess-santi.firebasestorage.app",
    messagingSenderId:"457562056307",
    appId:"1:457562056307:web:1be6c76bc8bdb5bd0aac06",
    measurementId:"G-SKL83F1C8B"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const roomInput=document.getElementById("room");
const connectBtn=document.getElementById("connect");
const status=document.getElementById("status");
const sound=document.getElementById("pressSound");
const buttons=document.querySelectorAll(".remote");

let roomRef=null;
let connected=false;
let localLock=false;
let currentRound=1;

/* One device = one team for this session */
let assignedTeam="";

function setButtons(enabled){
    buttons.forEach(b=>b.disabled=!enabled);
}

function applyTeamLock(){

    const team1=document.querySelector('[data-command="TEAM1"]');
    const team2=document.querySelector('[data-command="TEAM2"]');

    if(!assignedTeam){
        team1.disabled=!connected;
        team2.disabled=!connected;
        return;
    }

    team1.disabled=!connected || assignedTeam!=="TEAM1";
    team2.disabled=!connected || assignedTeam!=="TEAM2";
}

function setStatus(text,color="#f1c40f"){
    status.textContent=text;
    status.style.color=color;
}

connectBtn.onclick=async function(){

    const room=roomInput.value.trim();

    if(!room){
        setStatus("Enter a Room # first.","#e74c3c");
        return;
    }

    connectBtn.disabled=true;
    setStatus("Connecting...");

    roomRef=db.ref("rooms/"+room);

    try{
        const roundSnap=await roomRef.child("round").once("value");

        currentRound=Number(roundSnap.val()||1);

        /*
           Keep the remote synchronized with the current
           quiz round.
        */
        roomRef.child("round").on("value",snap=>{
            currentRound=Number(snap.val()||1);
        });

        await roomRef.child("remoteOnline").set(true);

        connected=true;
        applyTeamLock();

        document
            .querySelectorAll('[data-command="A"],[data-command="B"],[data-command="C"],[data-command="D"]')
            .forEach(b=>b.disabled=false);

        connectBtn.textContent="✓ CONNECTED";
        setStatus("Connected • Room "+room,"#00e676");

    }catch(error){

        console.error(error);
        connected=false;
        setButtons(false);
        connectBtn.disabled=false;

        setStatus("Firebase connection error.","#e74c3c");
    }
};


async function sendCommand(command){

    if(!connected || !roomRef || localLock)
        return;

    /* This device can belong to only ONE team. */
    if(command==="TEAM1" || command==="TEAM2"){

        if(assignedTeam && assignedTeam!==command)
            return;

        if(!assignedTeam){
            assignedTeam=command;
            applyTeamLock();
        }
    }

    /* Choices require a team assignment. */
    if(
        ["A","B","C","D"].includes(command) &&
        !assignedTeam
    ){
        setStatus(
            "Choose TEAM 1 or TEAM 2 first.",
            "#f1c40f"
        );
        return;
    }

    localLock=true;

    /*
       Only A/B/C/D are temporarily disabled.
       The assigned team remains selected.
    */
    const choiceButtons=
        document.querySelectorAll(
            '[data-command="A"],[data-command="B"],[data-command="C"],[data-command="D"]'
        );

    choiceButtons.forEach(b=>b.disabled=true);

    try{

        const result=await roomRef
            .child("remoteButton")
            .transaction(currentData=>{

                const now=Date.now();

                /* Global 1-second lock */
                if(
                    currentData &&
                    Number(currentData.lockUntil||0)>now
                ){
                    return;
                }

                return {
                    command:command,
                    team:assignedTeam,
                    round:currentRound,
                    timestamp:now,
                    lockUntil:now+1000
                };
            });

        if(result.committed){

            sound.currentTime=0;

            try{
                await sound.play();
            }catch(e){
                console.log("Audio blocked:",e);
            }

            setStatus(
                "Sent: "+command+" • "+assignedTeam,
                "#00e676"
            );

        }else{

            setStatus(
                "Another device pressed first.",
                "#f1c40f"
            );
        }

    }catch(error){

        console.error(error);
        setStatus("Send error.","#e74c3c");
    }

    /*
       After 1 second, choices become active again.
       The team assignment remains.
    */
    setTimeout(()=>{

        localLock=false;

        if(connected){
            applyTeamLock();
            choiceButtons.forEach(b=>b.disabled=false);
        }

    },1000);
}


buttons.forEach(button=>{

    button.addEventListener("click",()=>{

        const command=button.dataset.command;

        sendCommand(command);

    });

});
</script>

</body>
</html>
