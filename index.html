<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quiz Player Controller</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#101114;color:#fff}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
#app{width:100%;max-width:620px;height:100%;min-height:100dvh;padding:22px;display:flex;align-items:center;justify-content:center}
.screen{width:100%;display:none;flex-direction:column;align-items:center;text-align:center;gap:18px}
.screen.active{display:flex}
h1{font-size:30px;margin:0 0 8px}
.sub{opacity:.75;font-size:17px}
input{width:100%;max-width:420px;padding:18px;border:0;border-radius:14px;font-size:24px;text-align:center;outline:0}
.primary{width:100%;max-width:420px;padding:19px;border:0;border-radius:14px;background:#2196f3;color:#fff;font-size:21px;font-weight:700}
.primary:active,.teamPick:active,.buzzer:active,.answer:active{transform:scale(.97)}
.error{min-height:24px;color:#ff7777;font-weight:700}
.teamRow{display:flex;gap:18px;width:100%;justify-content:center}
.teamPick{width:150px;height:150px;border:0;border-radius:50%;color:#fff;font-size:20px;font-weight:800;box-shadow:0 8px 22px #0008}
.teamA{background:#2196f3}
.teamB{background:#e53935}
.room{font-size:20px;font-weight:700;opacity:.8}
.buzzer{position:relative;width:min(76vw,330px);height:min(76vw,330px);border:0;border-radius:50%;background:#35b94a;color:#fff;font-size:31px;font-weight:900;box-shadow:0 10px 35px #0008;touch-action:manipulation}
.buzzer.yellow{background:#ffd600;color:#111;animation:blink .55s infinite}
.buzzer.red{background:#e53935;color:#fff;cursor:not-allowed}
.buzzer.red:after{content:"✕";position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);font-size:145px;font-weight:900;line-height:1;opacity:.9}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.status{min-height:28px;font-size:20px;font-weight:800}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px;width:100%;max-width:420px}
.answer{height:92px;border:0;border-radius:14px;color:#fff;font-size:40px;font-weight:900;touch-action:manipulation}
.answer.a{background:#e53935}.answer.b{background:#1e88e5}.answer.c{background:#fbc02d;color:#111}.answer.d{background:#8e24aa}
.answer.disabled{opacity:.45;pointer-events:none}
.hidden{display:none!important}
.leave{border:0;border-radius:10px;padding:11px 22px;background:#3a3d43;color:#fff;font-size:16px}
.offline{color:#ff7070;font-size:15px;min-height:18px}
@media(max-width:380px){
 .teamPick{width:125px;height:125px;font-size:18px}
 .buzzer{width:68vw;height:68vw}
 .buzzer.red:after{font-size:120px}
}
</style>
</head>

<body>
<div id="app">

  <!-- ROOM -->
  <section id="roomScreen" class="screen active">
    <h1>ENTER ROOM NUMBER</h1>
    <div class="sub">Enter the room number given by the host.</div>
    <input id="roomInput" type="text" inputmode="numeric" autocomplete="off"
           placeholder="Room Number" maxlength="20">
    <button id="joinBtn" class="primary">ENTER ROOM</button>
    <div id="roomError" class="error"></div>
  </section>

  <!-- TEAM -->
  <section id="teamScreen" class="screen">
    <h1>SELECT TEAM</h1>
    <div id="roomText" class="room"></div>
    <div class="sub">Choose your team.</div>
    <div class="teamRow">
      <button id="teamA" class="teamPick teamA">TEAM A</button>
      <button id="teamB" class="teamPick teamB">TEAM B</button>
    </div>
    <div id="teamError" class="error"></div>
  </section>

  <!-- CONTROLLER -->
  <section id="gameScreen" class="screen">
    <div id="gameRoom" class="room"></div>
    <button id="buzzer" class="buzzer">TEAM</button>
    <div id="status" class="status">READY</div>

    <div id="answers" class="answers">
      <button class="answer a" data-answer="A">A</button>
      <button class="answer b" data-answer="B">B</button>
      <button class="answer c" data-answer="C">C</button>
      <button class="answer d" data-answer="D">D</button>
    </div>

    <div id="offline" class="offline"></div>
    <button id="leaveBtn" class="leave">LEAVE ROOM</button>
  </section>

</div>

<audio id="pressSound" preload="auto">
  <source src="sound.mp3" type="audio/mpeg">
</audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",
  authDomain: "jess-santi.firebaseapp.com",
  databaseURL: "https://jess-santi-default-rtdb.firebaseio.com/",
  projectId: "jess-santi",
  storageBucket: "jess-santi.firebasestorage.app",
  messagingSenderId: "457562056307",
  appId: "1:457562056307:web:1be6c76bc8bdb5bd0aac06",
  measurementId: "G-SKL83F1C8B"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="";
let team="";
let roomRef=null;
let currentRound=null;
let localLock=false;
let lastAcceptedTimestamp=0;

const $=id=>document.getElementById(id);
const roomScreen=$("roomScreen");
const teamScreen=$("teamScreen");
const gameScreen=$("gameScreen");
const buzzer=$("buzzer");
const statusEl=$("status");
const answers=$("answers");
const offline=$("offline");
const sound=$("pressSound");
const answerButtons=document.querySelectorAll(".answer");

function show(screen){
  [roomScreen,teamScreen,gameScreen].forEach(x=>x.classList.remove("active"));
  screen.classList.add("active");
}

function cleanRoom(s){
  return s.replace(/[^a-zA-Z0-9_-]/g,"").slice(0,20);
}

$("roomInput").addEventListener("input",e=>{
  e.target.value=cleanRoom(e.target.value);
});

/* ROOM */
$("joinBtn").onclick=async()=>{
  const value=cleanRoom($("roomInput").value.trim());
  $("roomError").textContent="";
  if(!value){
    $("roomError").textContent="Enter a room number.";
    return;
  }

  room=value;
  roomRef=db.ref("rooms/"+room);

  try{
    const snap=await roomRef.once("value");

    if(!snap.exists()){
      $("roomError").textContent="Room not found. Ask the host for the correct room number.";
      return;
    }

    $("roomText").textContent="ROOM "+room;
    show(teamScreen);

  }catch(err){
    console.error(err);
    $("roomError").textContent="Could not connect to the room.";
  }
};

/* ROUND */
function watchRound(){
  roomRef.child("round").on("value",snap=>{
    const round=snap.val();
    if(round===null)return;

    if(currentRound!==null && round!==currentRound){
      resetController();
    }

    currentRound=round;
  });
}

/* TEAM SELECTION */
$("teamA").onclick=()=>selectTeam("TEAM_A");
$("teamB").onclick=()=>selectTeam("TEAM_B");

function selectTeam(selected){
  team=selected;

  $("gameRoom").textContent=
    "ROOM "+room+" • "+(team==="TEAM_A"?"TEAM A":"TEAM B");

  buzzer.textContent=
    team==="TEAM_A"?"TEAM A":"TEAM B";

  resetController();
  show(gameScreen);
  watchRound();
}

/* RESET UI FOR A NEW ROUND */
function resetController(){
  localLock=false;
  buzzer.className="buzzer";
  buzzer.disabled=false;
  buzzer.textContent=team==="TEAM_A"?"TEAM A":"TEAM B";
  statusEl.textContent="READY";
  answerButtons.forEach(b=>{
    b.classList.remove("disabled");
    b.disabled=false;
  });
}

/*
  BUZZER:
  First successful team/device press gets sound.
  All other presses during the 1-second Firebase lock
  do not get sound.
*/
buzzer.onclick=async()=>{
  if(buzzer.disabled || localLock || !roomRef || !team)return;

  localLock=true;

  const ref=roomRef.child("remoteButton");

  try{
    const result=await ref.transaction(current=>{
      const now=Date.now();

      if(current && Number(current.lockUntil||0)>now){
        return;
      }

      return {
        command:"BUZZ",
        team:team,
        round:currentRound,
        timestamp:now,
        lockUntil:now+1000
      };
    });

    if(result.committed){
      buzzer.className="buzzer yellow";
      buzzer.disabled=true;
      statusEl.textContent="FIRST! CHOOSE YOUR ANSWER";

      try{
        sound.currentTime=0;
        await sound.play();
      }catch(e){
        console.log("Audio playback blocked:",e);
      }
    }else{
      buzzer.className="buzzer red";
      buzzer.disabled=true;
      statusEl.textContent="TOO LATE!";
    }

  }catch(err){
    console.error(err);
    statusEl.textContent="Connection error.";
  }

  setTimeout(()=>{
    /*
      After 1 second the buttons are active again.
      The buzzer returns to ready so another round/press
      can be sent without refreshing this remote.
    */
    localLock=false;
    buzzer.className="buzzer";
    buzzer.disabled=false;
    statusEl.textContent="READY";
  },1000);
};

/*
  A/B/C/D:
  All four are active after team selection.
  First accepted answer press also uses the same
  Firebase 1-second global lock and sound.
*/
answerButtons.forEach(button=>{
  button.onclick=async()=>{
    if(localLock || !roomRef || !team)return;

    localLock=true;

    answerButtons.forEach(b=>b.classList.add("disabled"));

    const ref=roomRef.child("remoteButton");

    try{
      const result=await ref.transaction(current=>{
        const now=Date.now();

        if(current && Number(current.lockUntil||0)>now){
          return;
        }

        return {
          command:button.dataset.answer,
          team:team,
          round:currentRound,
          timestamp:now,
          lockUntil:now+1000
        };
      });

      if(result.committed){
        statusEl.textContent=
          "FIRST: "+button.dataset.answer;

        try{
          sound.currentTime=0;
          await sound.play();
        }catch(e){
          console.log("Audio playback blocked:",e);
        }
      }else{
        statusEl.textContent="TOO LATE!";
      }

    }catch(err){
      console.error(err);
      statusEl.textContent="Connection error.";
    }

    setTimeout(()=>{
      localLock=false;
      answerButtons.forEach(b=>b.classList.remove("disabled"));
      statusEl.textContent="READY";
    },1000);
  };
});

/* LEAVE */
$("leaveBtn").onclick=()=>{
  location.reload();
};

/* CONNECTION */
db.ref(".info/connected").on("value",snap=>{
  offline.textContent=snap.val()===true?"":"OFFLINE";
});
</script>
</body>
</html>
