/* =========================================================
   BGM1 FADE VARIABLES
========================================================= */

let currentBgm1=null;

let bgm1Fading=false;

let bgm1FadeInterval=null;

let autoNextAfterBgm1=false;


/* =========================================================
   CLEAR FADE
========================================================= */

function clearBgm1Fade(){

    if(bgm1FadeInterval){

        clearInterval(
            bgm1FadeInterval
        );

        bgm1FadeInterval=null;
    }

    bgm1Fading=false;
}


/* =========================================================
   FADE OUT BGM1
========================================================= */

function fadeOutBgm1(callback){

    const audio=currentBgm1;

    if(!audio){

        if(callback)
            callback();

        return;
    }


    if(bgm1Fading)
        return;


    bgm1Fading=true;


    const startVolume=
        audio.volume;

    const fadeTime=1500;

    const steps=30;

    const stepTime=
        fadeTime/steps;

    let step=0;


    bgm1FadeInterval=
        setInterval(()=>{

            step++;


            audio.volume=
                Math.max(
                    0,
                    startVolume*
                    (1-step/steps)
                );


            if(step>=steps){

                clearInterval(
                    bgm1FadeInterval
                );

                bgm1FadeInterval=null;


                audio.pause();

                audio.currentTime=0;

                audio.volume=
                    startVolume;


                audio.onended=null;


                if(currentBgm1===audio){

                    currentBgm1=null;

                }


                bgm1Fading=false;


                if(callback)
                    callback();

            }

        },stepTime);
}


/* =========================================================
   START QUIZ BGM
========================================================= */

async function startQuizBGM(){

    stopAudio(bgm);
    stopAudio(bgm1);
    stopAudio(bgm3);


    /*
       Kung may BGM1 na kasalukuyang
       tumutugtog, fade muna.
    */

    if(currentBgm1){

        const oldBgm1=
            currentBgm1;


        currentBgm1=null;


        await new Promise(resolve=>{

            if(
                !oldBgm1.paused &&
                oldBgm1.currentTime>0
            ){

                const startVolume=
                    oldBgm1.volume;

                const fadeTime=1000;

                const steps=20;

                const stepTime=
                    fadeTime/steps;

                let step=0;


                const fade=
                    setInterval(()=>{

                        step++;


                        oldBgm1.volume=
                            Math.max(
                                0,
                                startVolume*
                                (1-step/steps)
                            );


                        if(step>=steps){

                            clearInterval(fade);


                            oldBgm1.pause();

                            oldBgm1.currentTime=0;

                            oldBgm1.volume=.5;

                            oldBgm1.onended=null;


                            resolve();
                        }

                    },stepTime);

            }else{

                oldBgm1.pause();

                oldBgm1.currentTime=0;

                oldBgm1.volume=.5;

                oldBgm1.onended=null;

                resolve();

            }

        });

    }


    bgm1Variants.forEach(audio=>{

        if(audio!==currentBgm1){

            audio.onended=null;

            audio.pause();

            audio.currentTime=0;

            audio.volume=.5;

        }

    });


    await playAudio(bgm2);
}


/* =========================================================
   PLAY RANDOM BGM1
========================================================= */

async function playCorrectBGM(){

    stopAudio(bgm2);
    stopAudio(bgm);
    stopAudio(bgm3);


    /*
       Clear previous BGM1
    */

    bgm1Variants.forEach(audio=>{

        audio.onended=null;

        audio.pause();

        audio.currentTime=0;

        audio.volume=.5;

    });


    clearBgm1Fade();


    const selected=
        bgm1Variants[
            Math.floor(
                Math.random()*
                bgm1Variants.length
            )
        ];


    currentBgm1=
        selected;


    selected.currentTime=0;

    selected.volume=.5;


    autoNextAfterBgm1=true;


    /*
       Kapag natural na natapos
       ang BGM1, automatic fade
       at next question.
    */

    selected.onended=function(){

        if(
            currentBgm1!==selected
        )
            return;


        /*
           Dahil onended na,
           maliit na fade transition
           bago next question.
        */

        selected.currentTime=0;

        selected.volume=.5;

        selected.play().catch(()=>{});


        fadeOutBgm1(()=>{

            if(autoNextAfterBgm1){

                autoNextAfterBgm1=false;

                startNextQuestionAfterBgm1();

            }

        });

    };


    await playAudio(selected);
}

let questions=[];


function createRandomQuiz(){

    let copy=[
        ...questionBank
    ];


    for(
        let i=copy.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );


        [
            copy[i],
            copy[j]
        ]=[
            copy[j],
            copy[i]
        ];

    }


    questions=copy;
}

/* =========================================================

========================================================= */

hostRoomBtn.onclick = async function(){

    const room = hostRoomInput.value.trim();

    if(!room){
        alert("Enter the room number used by Player 1 and Player 2.");
        return;
    }

    hostRoom = room;
    hostRoomRef = db.ref("rooms/" + hostRoom);

    try{
        const snapshot = await hostRoomRef.once("value");

        if(!snapshot.exists()){
            await hostRoomRef.set({
                createdAt: firebase.database.ServerValue.TIMESTAMP,
                round: 1,
                buzzer: null,
                answer: null,
                players: { player1:null, player2:null }
            });
        }

        connectionStatus.innerText = "Firebase: Connected • Room " + hostRoom;
        connectionStatus.classList.add("connected");
        hostRoomInput.disabled = true;
        hostRoomBtn.disabled = true;
        nextQuestionBtn.disabled = false;

        listenFirebaseRoom();
        await hostRoomRef.update({ round: 1, buzzer:null, answer:null });

    }catch(error){
        console.error(error);
        alert("Firebase connection error. Check your Realtime Database rules.");
    }
};

    if(currentQuestion >= questions.length - 1){
        finishQuiz();
        if(hostRoomRef) await hostRoomRef.update({ buzzer:null, answer:null });
        return;
    }

    currentQuestion++;
    if(hostRoomRef){
        const snap = await hostRoomRef.child("round").once("value");
        firebaseRound = Number(snap.val() || 0) + 1;
        await hostRoomRef.update({
            round: firebaseRound,
            buzzer:null,
            answer:null
        });
    }

    loadQuestion();
}

function listenFirebaseRoom(){
    if(firebaseListenersReady) return;
    firebaseListenersReady = true;

    hostRoomRef.child("buzzer").on("value", snapshot=>{
        const buzzer = snapshot.val();
        if(!buzzer){
            currentTeam = 0;
            team1Box.classList.remove("buzzer-winner","hidden-team");
            team2Box.classList.remove("buzzer-winner","hidden-team");
            buzz1.innerText = "Ready";
            buzz2.innerText = "Ready";
            return;
        }

        const team = buzzer.player === "player1" ? 1 : 2;
        currentTeam = team;
        stopBuzzTimer();
        hideTimer();

        team1Box.classList.remove("buzzer-winner","hidden-team");
        team2Box.classList.remove("buzzer-winner","hidden-team");

        if(team===1){
            team1Box.classList.add("buzzer-winner");
            team2Box.classList.add("hidden-team");
            buzz1.innerText = "🔵 PLAYER 1 BUZZED!";
            buzz2.innerText = "";
        }else{
            team2Box.classList.add("buzzer-winner");
            team1Box.classList.add("hidden-team");
            buzz2.innerText = "🔴 PLAYER 2 BUZZED!";
            buzz1.innerText = "";
        }

        startAnswerAfterBuzz();
        sendScreenState();
    });

    hostRoomRef.child("answer").on("value", snapshot=>{
        const data = snapshot.val();
        if(!data || answered) return;

        const index = {A:0,B:1,C:2,D:3}[String(data.answer).toUpperCase()];
        if(index === undefined) return;

        const buttons = document.querySelectorAll(".choice");
        const button = buttons[index];
        if(!button) return;

        selectAnswer(index, button, true);
    });

    hostRoomRef.child("round").on("value", snapshot=>{
        const r = Number(snapshot.val() || 1);
        if(firebaseRound && r !== firebaseRound){
            firebaseRound = r;
            currentTeam = 0;
            answered = false;
            loadQuestion();
        }else{
            firebaseRound = r;
        }
    });
}

/* =========================================================
   SECOND SCREEN
========================================================= */

const screenChannel=
    new BroadcastChannel(
        "team-quiz-screen"
    );


function sendScreenState(){

    screenChannel.postMessage({

        type:"STATE",

        question:
            questions[currentQuestion] ||
            null,

        currentQuestion,

        total:
            questions.length,

        currentTeam,

        scoreTeam1,

        scoreTeam2,

        answered,

        timerSeconds,

        timerMode,

        revealedChoices,

        answerAttempts,

        selectedAnswer:
            selectedAnswerIndex,

        answerResult

    });
}


/* =========================================================
   SECOND SCREEN OPEN
========================================================= */

document.getElementById(
    "secondScreenBtn"
).onclick=function(){

    const second=
        window.open(
            "second-screen.html",
            "TeamQuizSecondScreen",
            "width=1280,height=720,resizable=yes"
        );


    if(!second){

        alert(
            "Hindi nabuksan ang Second Screen. "+
            "I-allow ang pop-ups."
        );

        return;
    }


    setTimeout(
        sendScreenState,
        500
    );
};


/* =========================================================
   REVEAL CHOICE
========================================================= */

function revealNextChoice(){

    if(answered)
        return;


    if(revealedChoices>=4)
        return;


    revealedChoices++;


    const buttons=
        document.querySelectorAll(
            ".choice"
        );


    const index=
        revealedChoices-1;


    if(buttons[index]){

        buttons[index]
            .classList.add(
                "revealed"
            );
    }


    /*
       ONLY after 4 choices,
       start 10-second buzzer.
    */

    if(revealedChoices===4){

        startBuzzTimer();

    }


    sendScreenState();
}


/* =========================================================
   ENTER = NEXT CHOICE
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.target.tagName==="INPUT" ||
            event.target.tagName==="TEXTAREA"
        )
            return;


        if(event.key==="Enter"){

            event.preventDefault();

            revealNextChoice();

        }

    }
);


/* =========================================================
   BUZZER
========================================================= */

function teamBuzz(team){

    if(answered)
        return;


    if(revealedChoices<4)
        return;


    if(currentTeam===0){

        currentTeam=team;


        stopBuzzTimer();


        if(team===1){

            team1Box.classList.add(
                "buzzer-winner"
            );


            team2Box.classList.add(
                "hidden-team"
            );


            buzz1.innerText=
                "🔵 TEAM 1 BUZZED!";


            buzz2.innerText="";


        }else{

            team2Box.classList.add(
                "buzzer-winner"
            );


            team1Box.classList.add(
                "hidden-team"
            );


            buzz2.innerText=
                "🔴 TEAM 2 BUZZED!";


            buzz1.innerText="";
        }


        startAnswerAfterBuzz();


        sendScreenState();


        return;
    }


    /* TEAM 2 STEAL */

    if(
        currentTeam===3 &&
        team===2
    ){

        currentTeam=2;


        team1Box.classList.add(
            "hidden-team"
        );


        team2Box.classList.remove(
            "hidden-team"
        );


        team2Box.classList.add(
            "buzzer-winner"
        );


        buzz2.innerText=
            "🔴 TEAM 2 STEAL!";


        startAnswerAfterBuzz();


        sendScreenState();


        return;
    }


    /* TEAM 1 STEAL */

    if(
        currentTeam===4 &&
        team===1
    ){

        currentTeam=1;


        team2Box.classList.add(
            "hidden-team"
        );


        team1Box.classList.remove(
            "hidden-team"
        );


        team1Box.classList.add(
            "buzzer-winner"
        );


        buzz1.innerText=
            "🔵 TEAM 1 STEAL!";


        startAnswerAfterBuzz();


        sendScreenState();
    }
}


/* =========================================================
   ANSWER VARIABLES
========================================================= */

let selectedAnswerIndex=-1;

let answerResult="";


/* =========================================================
   ANSWER AFTER BUZZ
========================================================= */

function startAnswerAfterBuzz(){

    stopTimers();


    document
        .querySelectorAll(".choice")
        .forEach(button=>{

            if(
                button.classList.contains(
                    "revealed"
                )
            ){

                button.disabled=false;

            }

        });


    startAnswerTimer();


    sendScreenState();
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    if(
        currentQuestion>=
        questions.length
    ){

        finishQuiz();

        return;
    }


    currentTeam=0;

    answered=false;

    answerAttempts=0;

    revealedChoices=0;

    selectedAnswerIndex=-1;

    answerResult="";


    autoNextAfterBgm1=false;


    if(currentBgm1){

        currentBgm1.onended=null;

    }


    team1Box.classList.remove(
        "buzzer-winner",
        "hidden-team"
    );


    team2Box.classList.remove(
        "buzzer-winner",
        "hidden-team"
    );


    buzz1.innerText="Ready";

    buzz2.innerText="Ready";


    progressElement.innerText=
        "Question "+
        (currentQuestion+1)+
        " / "+
        questions.length;


    const q=
        questions[currentQuestion];


    questionElement.innerText=
        q.question;


    choicesElement.innerHTML="";


    const letters=[
        "A",
        "B",
        "C",
        "D"
    ];


    q.choices.forEach(
        (choice,index)=>{

            const button=
                document.createElement(
                    "button"
                );


            button.className=
                "choice";


            button.innerText=
                letters[index]+
                ". "+
                choice;


            button.disabled=true;


            button.onclick=function(){

                selectAnswer(
                    index,
                    button
                );

            };


            choicesElement.appendChild(
                button
            );

        }
    );


    stopTimers();

    hideTimer();


    messageElement.innerText="";


    sendScreenState();
}


/* =========================================================
   TIMERS
========================================================= */

let buzzTimer=null;

let answerTimer=null;

let timerSeconds=0;

let timerMode="";


function stopTimers(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;
    }


    if(answerTimer){

        clearInterval(
            answerTimer
        );

        answerTimer=null;
    }
}


function stopBuzzTimer(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;
    }
}


function stopTimerSound(){

    timerSound.onended=null;

    timerSound.pause();

    timerSound.currentTime=0;
}


function showTimer(
    seconds,
    mode
){

    timerMode=mode;

    timerSeconds=seconds;


    timerElement.style.display=
        "block";


    timerElement.innerText=
        seconds;


    if(mode==="buzz"){

        timerElement.style.borderColor=
            "#f1c40f";

        timerElement.style.color=
            "#f1c40f";

    }else{

        timerElement.style.borderColor=
            "#e67e22";

        timerElement.style.color=
            "#e67e22";
    }
}


function hideTimer(){

    timerElement.style.display=
        "none";


    timerSeconds=0;

    timerMode="";
}


/* =========================================================
   BUZZ TIMER
========================================================= */

function startBuzzTimer(){

    stopTimers();


    showTimer(
        10,
        "buzz"
    );


    buzzTimer=
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText=
                timerSeconds;


            sendScreenState();


            if(timerSeconds<=0){

                clearInterval(
                    buzzTimer
                );


                buzzTimer=null;


                hideTimer();


                messageElement.innerText="";


                setTimeout(()=>{

                    if(!answered)
                        nextQuestion();

                },500);

            }

        },1000);
}


/* =========================================================
   ANSWER TIMER
========================================================= */

function startAnswerTimer(){

    stopTimers();


    showTimer(
        10,
        "answer"
    );


    timerSound.currentTime=0;


    timerSound
        .play()
        .catch(()=>{});


    answerTimer=
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText=
                timerSeconds;


            sendScreenState();


            if(timerSeconds<=0){

                clearInterval(
                    answerTimer
                );


                answerTimer=null;


                handleAnswerTimeout();

            }

        },1000);
}


/* =========================================================
   ANSWER TIMEOUT
========================================================= */

function handleAnswerTimeout(){

    if(answered)
        return;


    stopTimers();

    stopTimerSound();

    hideTimer();


    document
        .querySelectorAll(".choice")
        .forEach(
            b=>b.disabled=true
        );


    answerAttempts++;


    wrongSound.currentTime=0;

    wrongSound
        .play()
        .catch(()=>{});


    if(answerAttempts>=3){

        revealCorrectAnswer();

        return;
    }


    prepareNextAttempt();
}


/* =========================================================
   REVEAL CORRECT ANSWER
========================================================= */

function revealCorrectAnswer(){

    const q=
        questions[currentQuestion];


    const buttons=
        document.querySelectorAll(
            ".choice"
        );


    buttons.forEach(
        (button,index)=>{

            button.disabled=true;


            if(
                index===q.answer
            ){

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    selectedAnswerIndex=
        q.answer;


    answerResult=
        "correct";


    answered=true;


    stopTimers();

    stopTimerSound();

    hideTimer();


    sendScreenState();
}


/* =========================================================
   NEXT ATTEMPT / STEAL
========================================================= */

function prepareNextAttempt(){

    if(answerAttempts>=3){

        revealCorrectAnswer();

        return;
    }


    if(
        currentTeam===1 ||
        currentTeam===4
    ){

        currentTeam=3;


        team1Box.classList.add(
            "hidden-team"
        );


        team2Box.classList.remove(
            "hidden-team"
        );


        team2Box.classList.add(
            "buzzer-winner"
        );


        buzz1.innerText=
            "❌ WRONG";


        buzz2.innerText=
            "🔴 STEAL";

    }else{

        currentTeam=4;


        team2Box.classList.add(
            "hidden-team"
        );


        team1Box.classList.remove(
            "hidden-team"
        );


        team1Box.classList.add(
            "buzzer-winner"
        );


        buzz2.innerText=
            "❌ WRONG";


        buzz1.innerText=
            "🔵 STEAL";
    }


    stopTimers();

    hideTimer();


    sendScreenState();
}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(
    index,
    button,
    fromRemote=false
){

    if(answered)
        return;

    if(!fromRemote)
        return;


    if(currentTeam===0)
        return;


    if(
        !fromRemote &&
        !button.classList.contains(
            "revealed"
        )
    )
        return;


    const q=
        questions[currentQuestion];


    const buttons=
        document.querySelectorAll(
            ".choice"
        );


    selectedAnswerIndex=index;


    /* =====================================================
       CORRECT
    ===================================================== */

    if(index===q.answer){

        answered=true;

        answerResult=
            "correct";


        stopTimers();

        stopTimerSound();

        hideTimer();


        button.classList.remove(
            "revealed"
        );


        button.classList.add(
            "correct"
        );


        buttons.forEach(
            b=>{

                b.disabled=true;

            }
        );


        correctSound.currentTime=0;


        correctSound
            .play()
            .catch(()=>{});


        /*
           Start random BGM1
        */

        playCorrectBGM();


        if(
            currentTeam===1 ||
            currentTeam===4
        ){

            scoreTeam1++;

            score1Element.innerText=
                scoreTeam1;

        }else{

            scoreTeam2++;

            score2Element.innerText=
                scoreTeam2;
        }


        sendScreenState();


        return;
    }


    /* =====================================================
       WRONG
    ===================================================== */

    answerResult=
        "wrong";


    button.classList.add(
        "wrong"
    );


    button.disabled=true;


    wrongSound.currentTime=0;


    wrongSound
        .play()
        .catch(()=>{});


    stopTimers();

    stopTimerSound();


    answerAttempts++;


    if(answerAttempts>=3){

        revealCorrectAnswer();

        return;
    }


    prepareNextAttempt();


    sendScreenState();
}


/* =========================================================
   HOST NEXT QUESTION SHORTCUT
   SPACEBAR = NEXT QUESTION
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.code!=="Space")
            return;

        if(
            event.target.tagName==="INPUT" ||
            event.target.tagName==="TEXTAREA"
        )
            return;

        event.preventDefault();

        if(!hostRoom)
            return;

        nextQuestion();
    }
);

/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){
    if(!hostRoomRef) return;
    goToNextQuestion();
}

/* =========================================================
   FINISH
========================================================= */

function finishQuiz(){

    stopAudio(bgm);

    stopAudio(bgm1);

    stopAudio(bgm2);

    stopAudio(bgm3);


    bgm1Variants.forEach(
        audio=>{

            audio.onended=null;

            audio.pause();

            audio.currentTime=0;

        }
    );


    currentBgm1=null;

    autoNextAfterBgm1=false;


    clearBgm1Fade();


    stopTimers();

    stopTimerSound();

    hideTimer();


    questionElement.innerText="";

    choicesElement.innerHTML="";

    progressElement.innerText="";


    messageElement.innerText=
        "QUIZ FINISHED";


    team1Box.style.display=
        "none";


    team2Box.style.display=
        "none";


    nextQuestionBtn.disabled=true;


    sendScreenState();
}

   SECOND SCREEN REQUEST
========================================================= */

screenChannel.onmessage=
    function(event){

        if(
            event.data &&
            event.data.type===
            "REQUEST_STATE"
        ){

            sendScreenState();

        }

    };


/* =========================================================
   INITIALIZE
========================================================= */

createRandomQuiz();

loadQuestion();

</script>
