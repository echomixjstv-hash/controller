<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Quiz Remote Controller</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:white;
}

body{
    display:flex;
    flex-direction:column;
}


/* =====================================================
   SETUP SCREEN
===================================================== */

#setupScreen{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:20px;

    text-align:center;
}

.logo{

    font-size:32px;
    font-weight:900;

    margin-bottom:30px;

    letter-spacing:2px;
}

.roomLabel{

    color:#aaa;
    font-size:17px;

    margin-bottom:10px;
}

#roomInput{

    width:100%;
    max-width:380px;

    height:65px;

    border:0;
    outline:0;

    border-radius:14px;

    background:#252525;

    color:white;

    text-align:center;

    font-size:32px;
    font-weight:bold;

    letter-spacing:5px;

    margin-bottom:25px;
}

#roomInput:focus{

    box-shadow:
        0 0 0 3px #3498db;
}

.playerLabel{

    color:#aaa;
    font-size:17px;

    margin-bottom:12px;
}

.playerButtons{

    width:100%;
    max-width:380px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}

.playerButton{

    height:80px;

    border:0;

    border-radius:16px;

    color:white;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 6px 0 rgba(0,0,0,.6);
}

.playerButton:active{

    transform:translateY(6px);

    box-shadow:none;
}

.player1Button{

    background:#3498db;
}

.player2Button{

    background:#e74c3c;
}

.setupStatus{

    margin-top:22px;

    min-height:20px;

    color:#888;

    font-size:14px;
}


/* =====================================================
   CONTROLLER
===================================================== */

#remoteScreen{

    width:100%;
    height:100%;

    display:none;

    flex-direction:column;

    padding:12px;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:58px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5px;
}

.playerName{

    font-size:25px;

    font-weight:900;
}

.roomName{

    color:#999;

    font-size:13px;

    margin-top:2px;
}

.changeButton{

    border:0;

    background:#333;

    color:white;

    border-radius:9px;

    padding:9px 12px;

    font-size:12px;
}


/* =====================================================
   ABCD BUTTONS
===================================================== */

.answers{

    width:100%;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    flex-shrink:0;
}

.answer{

    height:82px;

    border:0;

    border-radius:17px;

    color:white;

    font-size:40px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 6px 0 rgba(0,0,0,.6);
}

.answer:active{

    transform:translateY(6px);

    box-shadow:none;
}

#a{
    background:#c62828;
}

#b{
    background:#1565c0;
}

#c{
    background:#2e7d32;
}

#d{
    background:#ef6c00;
}


/* =====================================================
   BUZZ BUTTON
===================================================== */

.buzzArea{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px 0 7px;
}

#buzzButton{

    width:100%;
    height:100%;

    max-height:330px;

    border:0;

    border-radius:35px;

    background:#d50000;

    color:white;

    font-size:52px;

    font-weight:1000;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 12px 0 #750000,
        inset 0 0 30px rgba(255,255,255,.12);
}

#buzzButton:active{

    transform:translateY(12px);

    box-shadow:
        0 0 0 #750000,
        inset 0 0 30px rgba(255,255,255,.2);
}

#buzzButton.sent{

    background:#555;

    box-shadow:
        0 6px 0 #222;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    height:30px;

    flex-shrink:0;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:14px;

    color:#888;
}

.status.connected{

    color:#00e676;
}

.status.error{

    color:#ff5252;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-height:600px){

    .header{
        height:48px;
    }

    .answer{
        height:65px;
        font-size:32px;
    }

    #buzzButton{
        font-size:42px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SETUP
===================================================== -->

<div id="setupScreen">

    <div class="logo">
        🎮 QUIZ REMOTE
    </div>


    <div class="roomLabel">
        ROOM NUMBER
    </div>


    <input
        id="roomInput"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="0000"
        autocomplete="off"
    >


    <div class="playerLabel">
        SELECT PLAYER
    </div>


    <div class="playerButtons">

        <button
            class="playerButton player1Button"
            onclick="selectPlayer(1)"
        >
            PLAYER 1
        </button>


        <button
            class="playerButton player2Button"
            onclick="selectPlayer(2)"
        >
            PLAYER 2
        </button>

    </div>


    <div
        id="setupStatus"
        class="setupStatus"
    >
        Enter room number
    </div>

</div>



<!-- =====================================================
     REMOTE
===================================================== -->

<div id="remoteScreen">


    <div class="header">

        <div>

            <div
                id="playerName"
                class="playerName"
            >
                PLAYER 1
            </div>

            <div
                id="roomName"
                class="roomName"
            >
                ROOM 0000
            </div>

        </div>


        <button
            class="changeButton"
            onclick="changePlayer()"
        >
            CHANGE
        </button>

    </div>



    <!-- =================================================
         ABCD
    ================================================== -->

    <div class="answers">

        <button
            id="a"
            class="answer"
            onclick="sendAnswer('A')"
        >
            A
        </button>


        <button
            id="b"
            class="answer"
            onclick="sendAnswer('B')"
        >
            B
        </button>


        <button
            id="c"
            class="answer"
            onclick="sendAnswer('C')"
        >
            C
        </button>


        <button
            id="d"
            class="answer"
            onclick="sendAnswer('D')"
        >
            D
        </button>

    </div>



    <!-- =================================================
         BUZZ
    ================================================== -->

    <div class="buzzArea">

        <button
            id="buzzButton"
            onclick="sendBuzz()"
        >
            BUZZ!
        </button>

    </div>



    <div
        id="status"
        class="status"
    >
        Connecting...
    </div>

</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

    apiKey:"...",

    authDomain:
        "jess-santi.firebaseapp.com",

    databaseURL:
        "https://jess-santi-default-rtdb.firebaseio.com/",

    projectId:
        "jess-santi",

    storageBucket:
        "jess-santi.firebasestorage.app",

    messagingSenderId:
        "457562056307",

    appId:
        "1:457562056307:web:1be6c76bc8bdb5bd0aac06",

    measurementId:
        "G-SKL83F1C8B"

};


firebase.initializeApp(
    firebaseConfig
);


const db=
    firebase.database();



/* =====================================================
   VARIABLES
===================================================== */

let roomNumber="";

let playerNumber=0;

let playerNameValue="";

let roomRef=null;

let connected=false;



/* =====================================================
   ELEMENTS
===================================================== */

const setupScreen=
    document.getElementById(
        "setupScreen"
    );


const remoteScreen=
    document.getElementById(
        "remoteScreen"
    );


const roomInput=
    document.getElementById(
        "roomInput"
    );


const setupStatus=
    document.getElementById(
        "setupStatus"
    );


const playerName=
    document.getElementById(
        "playerName"
    );


const roomName=
    document.getElementById(
        "roomName"
    );


const status=
    document.getElementById(
        "status"
    );


const buzzButton=
    document.getElementById(
        "buzzButton"
    );



/* =====================================================
   SETUP MESSAGE
===================================================== */

function setupMessage(
    text,
    error=false
){

    setupStatus.innerText=
        text;

    setupStatus.style.color=
        error
        ? "#ff5252"
        : "#888";

}



/* =====================================================
   SELECT PLAYER
===================================================== */

window.selectPlayer=
async function(player){

    const room=
        roomInput.value.trim();


    if(!room){

        setupMessage(
            "Enter room number first.",
            true
        );

        roomInput.focus();

        return;
    }


    if(!/^[0-9]+$/.test(room)){

        setupMessage(
            "Numbers only.",
            true
        );

        return;
    }


    setupMessage(
        "Connecting to room..."
    );


    roomNumber=room;

    playerNumber=player;


    if(player===1){

        playerNameValue=
            "player1";

    }else{

        playerNameValue=
            "player2";

    }


    /*
       IMPORTANT:

       SAME PATH AS HOST

       rooms/{ROOM}
    */

    roomRef=
        db.ref(
            "rooms/"+roomNumber
        );


    try{

        /*
           Check room
        */

        await roomRef
        .once("value");


        connected=true;


        /*
           Save player information.
           This does NOT create the buzzer command.
        */

        await roomRef
        .child("players")
        .child(playerNameValue)
        .set({

            online:true,

            connectedAt:
                firebase.database.ServerValue.TIMESTAMP

        });


        /*
           Save local settings
        */

        localStorage.setItem(
            "quizRemoteRoom",
            roomNumber
        );


        localStorage.setItem(
            "quizRemotePlayer",
            playerNumber
        );


        openRemote();

    }
    catch(error){

        console.error(error);

        setupMessage(
            "Firebase connection failed.",
            true
        );

    }

};



/* =====================================================
   OPEN REMOTE
===================================================== */

function openRemote(){

    setupScreen.style.display=
        "none";


    remoteScreen.style.display=
        "flex";


    playerName.innerText=
        "PLAYER "+
        playerNumber;


    roomName.innerText=
        "ROOM "+
        roomNumber;


    if(playerNumber===1){

        playerName.style.color=
            "#42a5f5";

    }else{

        playerName.style.color=
            "#ef5350";

    }


    status.innerText=
        "Firebase: Connected";


    status.className=
        "status connected";

}



/* =====================================================
   CHANGE PLAYER
===================================================== */

window.changePlayer=
function(){

    remoteScreen.style.display=
        "none";


    setupScreen.style.display=
        "flex";


    setupMessage(
        "Select Player 1 or Player 2."
    );

};



/* =====================================================
   GET CURRENT ROUND
===================================================== */

async function getCurrentRound(){

    if(!roomRef)
        return 1;


    try{

        const snap=
            await roomRef
            .child("round")
            .once("value");


        const value=
            Number(snap.val());


        if(value>0)
            return value;


    }
    catch(error){

        console.error(error);

    }


    return 1;

}



/* =====================================================
   SEND BUZZ
===================================================== */

window.sendBuzz=
async function(){

    if(!connected)
        return;


    try{

        const round=
            await getCurrentRound();


        /*
           EXACT FORMAT EXPECTED
           BY HOST:

           rooms/ROOM/buzzer

           player: "player1"
           player: "player2"
           round: NUMBER
        */

        await roomRef
        .child("buzzer")
        .set({

            player:
                playerNameValue,

            round:
                round,

            timestamp:
                firebase.database.ServerValue.TIMESTAMP

        });


        /*
           Visual feedback
        */

        buzzButton.classList.add(
            "sent"
        );


        buzzButton.innerText=
            "BUZZ SENT";


        showStatus(
            "BUZZ SENT",
            false
        );


        setTimeout(()=>{

            buzzButton.classList.remove(
                "sent"
            );

            buzzButton.innerText=
                "BUZZ!";

        },700);


    }
    catch(error){

        console.error(error);

        showStatus(
            "Firebase error",
            true
        );

    }

};



/* =====================================================
   SEND ANSWER
===================================================== */

window.sendAnswer=
async function(answer){

    if(!connected)
        return;


    try{

        const round=
            await getCurrentRound();


        /*
           EXACT FORMAT EXPECTED
           BY HOST:

           rooms/ROOM/answer

           player: "player1"
           player: "player2"
           answer: A/B/C/D
           round: NUMBER
        */

        await roomRef
        .child("answer")
        .set({

            player:
                playerNameValue,

            answer:
                answer,

            round:
                round,

            timestamp:
                firebase.database.ServerValue.TIMESTAMP

        });


        showStatus(
            "ANSWER "+
            answer+
            " SENT",
            false
        );


    }
    catch(error){

        console.error(error);

        showStatus(
            "Firebase error",
            true
        );

    }

};



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    error=false
){

    status.innerText=
        text;

    status.className=
        error
        ? "status error"
        : "status connected";

}



/* =====================================================
   FIREBASE CONNECTION MONITOR
===================================================== */

db.ref(".info/connected")
.on(
    "value",
    snap=>{

        if(snap.val()===true){

            if(connected){

                showStatus(
                    "Firebase: Connected",
                    false
                );

            }

        }
        else{

            if(connected){

                showStatus(
                    "Firebase: Disconnected",
                    true
                );

            }

        }

    }
);



/* =====================================================
   RESTORE SAVED ROOM
===================================================== */

const savedRoom=
    localStorage.getItem(
        "quizRemoteRoom"
    );


const savedPlayer=
    localStorage.getItem(
        "quizRemotePlayer"
    );


if(savedRoom){

    roomInput.value=
        savedRoom;

}


/* =====================================================
   ENTER
===================================================== */

roomInput.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            if(
                roomInput.value.trim()
            ){

                setupMessage(
                    "Now select Player 1 or Player 2."
                );

            }

        }

    }
);


</script>

</body>
</html>
