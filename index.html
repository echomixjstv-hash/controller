<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Quiz Remote Controller</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
padding:0;
min-height:100%;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
}

#app{
width:100%;
max-width:560px;
min-height:100vh;
padding:20px;
display:flex;
align-items:center;
justify-content:center;
}

.screen{
display:none;
width:100%;
text-align:center;
align-items:center;
flex-direction:column;
gap:18px;
}

.screen.active{
display:flex;
}

h1{
margin:0;
font-size:30px;
}

.room{
font-size:20px;
opacity:.75;
}

input{
width:100%;
max-width:400px;
padding:18px;
border:0;
border-radius:14px;
font-size:24px;
text-align:center;
outline:none;
}

button{
font-family:inherit;
border:0;
cursor:pointer;
}

.enter{
width:100%;
max-width:400px;
padding:18px;
border-radius:14px;
background:#2196f3;
color:#fff;
font-size:22px;
font-weight:bold;
}

.players{
display:flex;
gap:18px;
justify-content:center;
width:100%;
}

.playerPick{
width:145px;
height:145px;
border-radius:50%;
background:#4caf50;
color:#fff;
font-size:20px;
font-weight:bold;
}

.playerPick:active,
.buzzer:active,
.answer:active{
transform:scale(.95);
}


.buzzer{
position:relative;
width:min(72vw,320px);
height:min(72vw,320px);
border-radius:50%;
background:#4caf50;
color:#fff;
font-size:30px;
font-weight:bold;
box-shadow:0 10px 35px #0008;
}

.buzzer.yellow{
background:#4caf50;
color:#fff;
animation:none;
}

.buzzer.red{
background:#e53935;
color:#fff;
cursor:default;
}

.buzzer.red:after{
content:"✕";
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:145px;
font-weight:900;
}

.buzzer.waiting{
background:#555;
color:#bbb;
cursor:not-allowed;
box-shadow:none;
}

@keyframes blink{
0%,100%{opacity:1}
50%{opacity:.28}
}

.status{
min-height:28px;
font-size:20px;
font-weight:bold;
}

.attempt{
font-size:17px;
opacity:.8;
}


/* =========================
   ANSWERS
========================= */

.answers{
width:100%;
max-width:400px;
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin:0 auto;
}

.answers.hidden{
display:none!important;
}

.answer{
height:100px;
border-radius:16px;
color:#fff;
font-size:40px;
font-weight:bold;
}

.a{
background:#e53935;
}

.b{
background:#1e88e5;
}

.c{
background:#fbc02d;
color:#111;
}

.d{
background:#8e24aa;
}

.answer.selected{
outline:6px solid #fff;
outline-offset:-6px;
}



/* =========================
   MESSAGES
========================= */

.error{
color:#ff8a80;
min-height:25px;
font-size:17px;
font-weight:bold;
}

.note{
font-size:14px;
opacity:.6;
max-width:390px;
}

.leave{
padding:12px 22px;
border-radius:10px;
background:#444;
color:#fff;
font-size:16px;
}

.hidden{
display:none!important;
}

</style>
</head>

<body>

<div id="app">


<!-- =====================================================
     ROOM SCREEN
===================================================== -->

<section id="roomScreen" class="screen active">

<h1>ENTER ROOM NUMBER</h1>

<input
id="roomInput"
inputmode="numeric"
maxlength="20"
placeholder="Room Number"
autocomplete="off">

<button id="enterBtn" class="enter">
ENTER ROOM
</button>

<div id="roomError" class="error"></div>

<div class="note">
Enter the same room number used by the host.
</div>

</section>


<!-- =====================================================
     PLAYER SCREEN
===================================================== -->

<section id="playerScreen" class="screen">

<h1>SELECT PLAYER</h1>

<div id="playerRoom" class="room"></div>

<div class="players">

<button id="p1" class="playerPick">
PLAYER 1
</button>

<button id="p2" class="playerPick">
PLAYER 2
</button>

</div>

<div id="playerError" class="error"></div>

</section>


<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section id="gameScreen" class="screen">

<div id="gameRoom" class="room"></div>

<div id="attempt" class="attempt">
ATTEMPT 1 OF 3
</div>

<button id="buzzer" class="buzzer waiting">
WAITING
</button>

<div id="status" class="status">
WAITING FOR QUESTION
</div>


<!-- ANSWERS -->

<div id="answers" class="answers hidden">

<button class="answer a" data-answer="A">
A
</button>

<button class="answer b" data-answer="B">
B
</button>

<button class="answer c" data-answer="C">
C
</button>

<button class="answer d" data-answer="D">
D
</button>

</div>


<button id="leaveBtn" class="leave">
LEAVE ROOM
</button>

</section>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

apiKey:"AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",

authDomain:"jess-santi.firebaseapp.com",

databaseURL:"https://jess-santi-default-rtdb.firebaseio.com/",

projectId:"jess-santi",

storageBucket:"jess-santi.firebasestorage.app",

messagingSenderId:"457562056307",

appId:"1:457562056307:web:1be6c76bc8bdb5bd0aac06",

measurementId:"G-SKL83F8C8B"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


/* =====================================================
   AUDIO
===================================================== */

const firstSound=
new Audio("sound.mp3");

const lateSound=
new Audio("better-luck-next-time.mp3");

firstSound.preload="auto";
lateSound.preload="auto";


/* =====================================================
   VARIABLES
===================================================== */

let room="";
let player="";

let roomRef=null;
let playerRef=null;

let currentRound=null;
let currentAttempt=1;

let joined=false;

let localBuzz=false;
let answerSent=false;

let allowedPlayer=null;

let questionReady=false;
let currentPhase="WAITING";

let roomWatcherStarted=false;


/* =====================================================
   ELEMENT SHORTCUT
===================================================== */

const $=id=>
document.getElementById(id);


/* =====================================================
   SCREEN
===================================================== */

function show(el){

[
$("roomScreen"),
$("playerScreen"),
$("gameScreen")
].forEach(x=>{
x.classList.remove("active");
});

el.classList.add("active");

}


/* =====================================================
   SOUND
===================================================== */

function sound(audio){

try{

audio.currentTime=0;

audio.play().catch(()=>{});

}catch(e){}

}


/* =====================================================
   ANSWER BUTTONS
===================================================== */

function setAnswerButtons(on){
document.querySelectorAll(".answer").forEach(button=>{
button.disabled=false;
});
}

function clearAnswerSelection(){

document
.querySelectorAll(".answer")
.forEach(button=>{
button.disabled=false;

button.onclick=async()=>{
if(!joined)return;

questionReady=true;
answerSent=false;

const answer=button.dataset.answer;

try{
await roomRef.child("answer").set({
player:player,
round:currentRound,
attempt:currentAttempt,
answer:answer,
at:firebase.database.ServerValue.TIMESTAMP
});

clearAnswerSelection();
button.classList.add("selected");

$("status").textContent=
"ANSWER SENT: "+answer;

$("answers").classList.remove("hidden");
setAnswerButtons(true);

}catch(e){
console.error(e);
$("status").textContent="CONNECTION ERROR";
}
};
});

/* =====================================================
   LEAVE
===================================================== */

$("leaveBtn").onclick=async()=>{

try{

if(playerRef){

await playerRef.remove();

}

}catch(e){}

location.reload();

};


/* =====================================================
   CLOSE
===================================================== */

window.addEventListener(
"beforeunload",
()=>{

if(playerRef){

playerRef.remove().catch(()=>{});

}

});


/* =====================================================
   ENTER KEY
===================================================== */

$("roomInput").addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

$("enterBtn").click();

}

});

</script>

</body>
</html>
