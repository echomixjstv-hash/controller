<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quiz Remote Controller</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#app{
  width:100%;
  max-width:600px;
  min-height:100vh;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.screen{
  width:100%;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.screen.active{
  display:flex;
}

h1{
  margin:0;
  font-size:30px;
}

input{
  width:100%;
  max-width:400px;
  padding:18px;
  border:0;
  border-radius:12px;
  font-size:24px;
  text-align:center;
  outline:none;
}

.mainBtn{
  width:100%;
  max-width:400px;
  padding:20px;
  border:0;
  border-radius:15px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.joinBtn{
  background:#2196f3;
  color:white;
}

.playerChoices{
  display:flex;
  gap:20px;
  width:100%;
  justify-content:center;
}

.playerSelect{
  width:150px;
  height:150px;
  border-radius:50%;
  border:0;
  background:#4caf50;
  color:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.playerSelect:active{
  transform:scale(.95);
}

#roomLabel{
  font-size:22px;
  opacity:.8;
}

#playerButton{
  position:relative;
  width:min(75vw,330px);
  height:min(75vw,330px);
  border-radius:50%;
  border:0;
  background:#4caf50;
  color:white;
  font-size:32px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,0,0,.5);
}

#playerButton.yellow{
  background:#ffd600;
  color:#111;
  animation:blink .55s infinite;
}

#playerButton.red{
  background:#e53935;
  color:white;
  cursor:not-allowed;
}

#playerButton.red::after{
  content:"✕";
  position:absolute;
  font-size:150px;
  line-height:1;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:.9;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.25}
}

#status{
  min-height:30px;
  font-size:20px;
  font-weight:bold;
}

.answerGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  width:100%;
  max-width:400px;
}

.answer{
  height:100px;
  border:0;
  border-radius:15px;
  font-size:40px;
  font-weight:bold;
  cursor:pointer;
}

.answer:active{
  transform:scale(.95);
}

#a{background:#f44336;color:white}
#b{background:#2196f3;color:white}
#c{background:#ffc107;color:#111}
#d{background:#9c27b0;color:white}

.hidden{
  display:none!important;
}

.smallBtn{
  padding:12px 25px;
  border:0;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.leaveBtn{
  background:#555;
  color:white;
}
</style>
</head>

<body>

<div id="app">

  <!-- ROOM SCREEN -->
  <div id="roomScreen" class="screen active">
    <h1>ENTER ROOM NUMBER</h1>

    <input
      id="roomInput"
      type="text"
      inputmode="numeric"
      maxlength="20"
      placeholder="Room Number"
    >

    <button class="mainBtn joinBtn" id="joinRoom">
      ENTER ROOM
    </button>

    <div id="roomError"></div>
  </div>


  <!-- PLAYER SCREEN -->
  <div id="playerScreen" class="screen">

    <h1>SELECT PLAYER</h1>

    <div id="roomLabel"></div>

    <div class="playerChoices">

      <button class="playerSelect" id="player1">
        PLAYER 1
      </button>

      <button class="playerSelect" id="player2">
        PLAYER 2
      </button>

    </div>

  </div>


  <!-- BUZZER SCREEN -->
  <div id="gameScreen" class="screen">

    <div id="roomLabel2"></div>

    <button id="playerButton">
      PLAYER
    </button>

    <div id="status">
      READY
    </div>

    <div id="answers" class="answerGrid hidden">

      <button class="answer" id="a">A</button>
      <button class="answer" id="b">B</button>
      <button class="answer" id="c">C</button>
      <button class="answer" id="d">D</button>

    </div>

    <button class="smallBtn leaveBtn" id="leaveRoom">
      LEAVE ROOM
    </button>

  </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",
  authDomain: "jess-santi.firebaseapp.com",
  databaseURL: "https://jess-santi-default-rtdb.firebaseio.com/",
  projectId: "jess-santi",
  storageBucket: "jess-santi.firebasestorage.app",
  messagingSenderId: "457562056307",
  appId: "1:457562056307:web:1be6c76bc8bdb5bd0aac06",
  measurementId: "G-SKL83F1C8B"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let roomNumber = "";
let playerNumber = "";
let roomRef = null;
let playerRef = null;
let roundRef = null;

const roomScreen = document.getElementById("roomScreen");
const playerScreen = document.getElementById("playerScreen");
const gameScreen = document.getElementById("gameScreen");

const roomInput = document.getElementById("roomInput");
const roomError = document.getElementById("roomError");

const playerButton = document.getElementById("playerButton");
const statusText = document.getElementById("status");
const answers = document.getElementById("answers");

function showScreen(screen){
  roomScreen.classList.remove("active");
  playerScreen.classList.remove("active");
  gameScreen.classList.remove("active");

  screen.classList.add("active");
}


/* ENTER ROOM */

document.getElementById("joinRoom").onclick = async () => {

  const room = roomInput.value.trim();

  if(!room){
    roomError.textContent = "Enter a room number.";
    return;
  }

  roomNumber = room;

  roomRef = db.ref("rooms/" + roomNumber);

  try{

    const snapshot = await roomRef.once("value");

    if(!snapshot.exists()){

      await roomRef.set({
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        round: 1,
        buzzer: null,
        players:{
          player1:null,
          player2:null
        }
      });

    }

    document.getElementById("roomLabel").textContent =
      "ROOM " + roomNumber;

    showScreen(playerScreen);

  }catch(error){

    console.error(error);

    roomError.textContent =
      "Firebase connection error.";

  }

};


/* SELECT PLAYER 1 */

document.getElementById("player1").onclick = () => {
  choosePlayer("player1");
};


/* SELECT PLAYER 2 */

document.getElementById("player2").onclick = () => {
  choosePlayer("player2");
};


async function choosePlayer(player){

  playerNumber = player;

  playerRef = roomRef.child("players/" + playerNumber);

  try{

    const result = await playerRef.transaction(current => {

      if(current === null){

        return {
          connected:true,
          joinedAt:firebase.database.ServerValue.TIMESTAMP
        };

      }

      return;

    });

    if(!result.committed){

      alert(
        playerNumber.toUpperCase() +
        " is already occupied."
      );

      return;

    }

    document.getElementById("roomLabel2").textContent =
      "ROOM " + roomNumber;

    playerButton.textContent =
      playerNumber === "player1"
      ? "PLAYER 1"
      : "PLAYER 2";

    showScreen(gameScreen);

    listenToRound();

  }catch(error){

    console.error(error);

    alert("Unable to join player slot.");

  }

}


/* LISTEN FOR CURRENT ROUND */

function listenToRound(){

  roundRef = roomRef.child("round");

  roundRef.on("value", snapshot => {

    const round = snapshot.val() || 1;

    resetLocalButton();

  });

}


/* PLAYER BUZZER */

playerButton.onclick = async () => {

  if(playerButton.classList.contains("red")){
    return;
  }

  if(playerButton.classList.contains("yellow")){
    return;
  }

  const buzzerRef = roomRef.child("buzzer");

  try{

    const result = await buzzerRef.transaction(current => {

      if(current === null){

        return {
          player:playerNumber,
          time:firebase.database.ServerValue.TIMESTAMP
        };

      }

      return;

    });

    if(result.committed){

      const buzzer = result.snapshot.val();

      if(
        buzzer &&
        buzzer.player === playerNumber
      ){

        setWinner();

      }

    }

  }catch(error){

    console.error(error);

  }

};


/* WATCH BUZZER */

function watchBuzzer(){

  roomRef.child("buzzer").on("value", snapshot => {

    const buzzer = snapshot.val();

    if(!buzzer){

      resetLocalButton();
      return;

    }

    if(buzzer.player === playerNumber){

      setWinner();

    }else{

      setLoser();

    }

  });

}


/* WINNER */

function setWinner(){

  playerButton.classList.remove("red");
  playerButton.classList.add("yellow");

  statusText.textContent =
    "FIRST!";

  answers.classList.remove("hidden");

}


/* LOSER */

function setLoser(){

  playerButton.classList.remove("yellow");
  playerButton.classList.add("red");

  statusText.textContent =
    "TOO LATE!";

  answers.classList.add("hidden");

}


/* RESET */

function resetLocalButton(){

  playerButton.classList.remove("yellow");
  playerButton.classList.remove("red");

  playerButton.style.background = "#4caf50";

  statusText.textContent =
    "READY";

  answers.classList.add("hidden");

}


/* ANSWERS */

["a","b","c","d"].forEach(letter => {

  document.getElementById(letter).onclick = async () => {

    const buzzer =
      await roomRef.child("buzzer").once("value");

    const data = buzzer.val();

    if(!data) return;

    if(data.player !== playerNumber) return;

    await roomRef.child("answer").set({
      player:playerNumber,
      answer:letter.toUpperCase(),
      time:firebase.database.ServerValue.TIMESTAMP
    });

    statusText.textContent =
      "ANSWER: " + letter.toUpperCase();

  };

});


/* LEAVE */

document.getElementById("leaveRoom").onclick = async () => {

  if(playerRef){

    await playerRef.remove();

  }

  if(roomRef){

    roomRef.child("buzzer").remove();

  }

  location.reload();

};


/*
  IMPORTANT:
  Start listening to the buzzer after joining.
*/

const originalListenToRound = listenToRound;

listenToRound = function(){

  originalListenToRound();

  watchBuzzer();

};

</script>

</body>
</html>
