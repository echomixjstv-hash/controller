<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Quiz Remote</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:white;
}

body{
    display:flex;
    flex-direction:column;
}


/* =================================
   SETUP SCREEN
================================= */

#setupScreen{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:25px;

    text-align:center;
}


.logo{

    font-size:32px;
    font-weight:900;

    margin-bottom:35px;

    letter-spacing:2px;
}


.roomTitle{

    font-size:18px;
    color:#aaa;

    margin-bottom:10px;
}


#roomInput{

    width:100%;
    max-width:400px;

    height:70px;

    border:none;
    outline:none;

    border-radius:15px;

    background:#222;

    color:white;

    text-align:center;

    font-size:34px;
    font-weight:bold;

    letter-spacing:6px;

    margin-bottom:25px;
}


#roomInput:focus{

    box-shadow:
        0 0 0 3px #2196f3;

}


.playerTitle{

    font-size:18px;
    color:#aaa;

    margin-bottom:12px;
}


.playerButtons{

    width:100%;
    max-width:400px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}


.playerButton{

    height:80px;

    border:none;

    border-radius:16px;

    color:white;

    font-size:23px;

    font-weight:900;

    background:#252525;

    cursor:pointer;

    box-shadow:
        0 6px 0 #111;
}


.playerButton:active{

    transform:translateY(6px);

    box-shadow:
        0 0 0 #111;
}


#player1{

    background:#1565c0;

}


#player2{

    background:#c62828;

}


.setupStatus{

    margin-top:25px;

    min-height:25px;

    color:#888;

    font-size:14px;
}


/* =================================
   REMOTE SCREEN
================================= */

#remoteScreen{

    width:100%;
    height:100%;

    display:none;

    flex-direction:column;

    padding:12px;
}


/* =================================
   HEADER
================================= */

.header{

    height:65px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 8px;
}


.playerName{

    font-size:26px;

    font-weight:900;
}


.roomName{

    font-size:14px;

    color:#aaa;

}


.changePlayer{

    border:none;

    background:#333;

    color:white;

    padding:10px 13px;

    border-radius:10px;

    font-size:12px;

}


/* =================================
   ANSWERS
================================= */

.answers{

    width:100%;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    flex-shrink:0;
}


.answer{

    height:85px;

    border:none;

    border-radius:17px;

    color:white;

    font-size:40px;

    font-weight:900;

    cursor:pointer;

    user-select:none;

    box-shadow:
        0 6px 0 rgba(0,0,0,.55);

}


.answer:active{

    transform:translateY(6px);

    box-shadow:
        0 0 0 rgba(0,0,0,0);
}


.answer.disabled{

    opacity:.45;

}


#a{

    background:#c62828;

}


#b{

    background:#1565c0;

}


#c{

    background:#2e7d32;

}


#d{

    background:#ef6c00;

}


/* =================================
   BUZZ
================================= */

.buzzArea{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px 0 8px;

}


#buzzButton{

    width:100%;

    height:100%;

    max-height:330px;

    border:none;

    border-radius:35px;

    background:#d50000;

    color:white;

    font-size:52px;

    font-weight:1000;

    letter-spacing:2px;

    cursor:pointer;

    user-select:none;

    box-shadow:
        0 12px 0 #750000,
        inset 0 0 30px rgba(255,255,255,.12);

}


#buzzButton:active{

    transform:translateY(12px);

    box-shadow:
        0 0 0 #750000,
        inset 0 0 30px rgba(255,255,255,.2);

}


#buzzButton.sent{

    background:#555;

    box-shadow:
        0 6px 0 #222;

}


/* =================================
   STATUS
================================= */

.status{

    height:32px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:14px;

    color:#999;

}


.status.connected{

    color:#00e676;

}


.status.error{

    color:#ff5252;

}


/* =================================
   PLAYER COLORS
================================= */

.player1Theme{

    border-color:#1565c0;

}


.player2Theme{

    border-color:#c62828;

}


</style>

</head>


<body>


<!-- =================================
     SETUP SCREEN
================================= -->

<div id="setupScreen">

    <div class="logo">
        QUIZ REMOTE
    </div>


    <div class="roomTitle">
        ROOM NUMBER
    </div>


    <input
        id="roomInput"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="0000"
        autocomplete="off"
    >


    <div class="playerTitle">
        SELECT PLAYER
    </div>


    <div class="playerButtons">

        <button
            id="player1"
            class="playerButton"
            onclick="selectPlayer(1)"
        >
            PLAYER 1
        </button>


        <button
            id="player2"
            class="playerButton"
            onclick="selectPlayer(2)"
        >
            PLAYER 2
        </button>

    </div>


    <div
        id="setupStatus"
        class="setupStatus"
    >
        Enter room number
    </div>

</div>



<!-- =================================
     REMOTE SCREEN
================================= -->

<div id="remoteScreen">


    <div class="header">

        <div>

            <div
                class="playerName"
                id="playerName"
            >
                PLAYER 1
            </div>

            <div
                class="roomName"
                id="roomName"
            >
                ROOM 0000
            </div>

        </div>


        <button
            class="changePlayer"
            onclick="changePlayer()"
        >
            CHANGE
        </button>

    </div>



    <!-- =============================
         ABCD
    ============================== -->

    <div class="answers">

        <button
            id="a"
            class="answer"
            onclick="sendAnswer('A')"
        >
            A
        </button>


        <button
            id="b"
            class="answer"
            onclick="sendAnswer('B')"
        >
            B
        </button>


        <button
            id="c"
            class="answer"
            onclick="sendAnswer('C')"
        >
            C
        </button>


        <button
            id="d"
            class="answer"
            onclick="sendAnswer('D')"
        >
            D
        </button>

    </div>



    <!-- =============================
         BUZZ
    ============================== -->

    <div class="buzzArea">

        <button
            id="buzzButton"
            onclick="sendBuzz()"
        >
            BUZZ!
        </button>

    </div>



    <div
        id="status"
        class="status"
    >
        Connecting...
    </div>


</div>



<!-- =================================
     FIREBASE
================================= -->

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    set
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {

    apiKey:
        "...",

    authDomain:
        "jess-santi.firebaseapp.com",

    databaseURL:
        "https://jess-santi-default-rtdb.firebaseio.com/",

    projectId:
        "jess-santi",

    storageBucket:
        "jess-santi.firebasestorage.app",

    messagingSenderId:
        "457562056307",

    appId:
        "1:457562056307:web:1be6c76bc8bdb5bd0aac06"

};



/* =================================
   FIREBASE INIT
================================= */

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);



/* =================================
   DEVICE ID
================================= */

function getDeviceId(){

    let id =
        localStorage.getItem(
            "quizRemoteDeviceId"
        );


    if(!id){

        id =
            "device_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,9);


        localStorage.setItem(
            "quizRemoteDeviceId",
            id
        );

    }


    return id;

}


const deviceId =
    getDeviceId();



/* =================================
   VARIABLES
================================= */

let currentRoom = "";

let currentPlayer = 0;



/* =================================
   ELEMENTS
================================= */

const setupScreen =
    document.getElementById(
        "setupScreen"
    );


const remoteScreen =
    document.getElementById(
        "remoteScreen"
    );


const roomInput =
    document.getElementById(
        "roomInput"
    );


const setupStatus =
    document.getElementById(
        "setupStatus"
    );


const playerName =
    document.getElementById(
        "playerName"
    );


const roomName =
    document.getElementById(
        "roomName"
    );


const status =
    document.getElementById(
        "status"
    );


const buzzButton =
    document.getElementById(
        "buzzButton"
    );



/* =================================
   SETUP STATUS
================================= */

function setupMessage(
    message,
    error=false
){

    setupStatus.textContent =
        message;

    setupStatus.style.color =
        error
        ? "#ff5252"
        : "#888";

}



/* =================================
   SELECT PLAYER
================================= */

window.selectPlayer =
async function(player){

    const room =
        roomInput.value.trim();


    if(!room){

        setupMessage(
            "Enter room number first.",
            true
        );

        roomInput.focus();

        return;

    }


    if(!/^[0-9]+$/.test(room)){

        setupMessage(
            "Room number must contain numbers only.",
            true
        );

        return;

    }


    setupMessage(
        "Connecting..."
    );


    try{

        currentRoom =
            room;

        currentPlayer =
            player;


        /*
           Register device
        */

        const playerPath =
            "quiz/rooms/" +
            currentRoom +
            "/players/player" +
            currentPlayer;


        await set(
            ref(db,playerPath),
            {

                player:
                    currentPlayer,

                deviceId:
                    deviceId,

                online:
                    true,

                lastSeen:
                    Date.now()

            }
        );


        /*
           Save local assignment
        */

        localStorage.setItem(
            "quizRoom",
            currentRoom
        );


        localStorage.setItem(
            "quizPlayer",
            currentPlayer
        );


        /*
           Open remote
        */

        openRemote();


    }
    catch(error){

        console.error(error);

        setupMessage(
            "Firebase connection failed.",
            true
        );

    }

};



/* =================================
   OPEN REMOTE
================================= */

function openRemote(){

    setupScreen.style.display =
        "none";


    remoteScreen.style.display =
        "flex";


    playerName.textContent =
        "PLAYER " +
        currentPlayer;


    roomName.textContent =
        "ROOM " +
        currentRoom;


    status.textContent =
        "Connected";


    status.className =
        "status connected";


    if(currentPlayer === 1){

        playerName.style.color =
            "#42a5f5";

    }
    else{

        playerName.style.color =
            "#ef5350";

    }

}



/* =================================
   CHANGE PLAYER
================================= */

window.changePlayer =
function(){

    remoteScreen.style.display =
        "none";


    setupScreen.style.display =
        "flex";


    setupMessage(
        "Select player"
    );

};



/* =================================
   SEND BUZZ
================================= */

window.sendBuzz =
async function(){

    if(!currentRoom ||
       !currentPlayer){

        return;

    }


    const now =
        Date.now();


    try{

        /*
           Unique event ID.

           Hindi natin ginagamit ang
           player ID bilang event key
           para walang overwrite kapag
           sunod-sunod ang pindot.
        */

        const eventId =
            now +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,7);


        const buzzPath =
            "quiz/rooms/" +
            currentRoom +
            "/events/buzz/" +
            eventId;


        await set(
            ref(db,buzzPath),
            {

                room:
                    currentRoom,

                player:
                    currentPlayer,

                deviceId:
                    deviceId,

                action:
                    "BUZZ",

                time:
                    now

            }
        );


        /*
           Visual feedback
        */

        buzzButton.classList.add(
            "sent"
        );


        buzzButton.textContent =
            "BUZZ SENT";


        status.textContent =
            "Buzz sent!";


        status.className =
            "status connected";


        setTimeout(()=>{

            buzzButton.classList.remove(
                "sent"
            );


            buzzButton.textContent =
                "BUZZ!";


        },700);


    }
    catch(error){

        console.error(error);


        status.textContent =
            "Firebase error";


        status.className =
            "status error";

    }

};



/* =================================
   SEND ANSWER
================================= */

window.sendAnswer =
async function(answer){

    if(!currentRoom ||
       !currentPlayer){

        return;

    }


    const now =
        Date.now();


    try{

        const eventId =
            now +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,7);


        const answerPath =
            "quiz/rooms/" +
            currentRoom +
            "/events/answers/" +
            eventId;


        await set(
            ref(db,answerPath),
            {

                room:
                    currentRoom,

                player:
                    currentPlayer,

                deviceId:
                    deviceId,

                action:
                    "ANSWER",

                answer:
                    answer,

                time:
                    now

            }
        );


        status.textContent =
            "ANSWER " +
            answer +
            " SENT";


        status.className =
            "status connected";


    }
    catch(error){

        console.error(error);


        status.textContent =
            "Firebase error";


        status.className =
            "status error";

    }

};



/* =================================
   AUTO RESTORE
================================= */

const savedRoom =
    localStorage.getItem(
        "quizRoom"
    );


const savedPlayer =
    localStorage.getItem(
        "quizPlayer"
    );


if(savedRoom && savedPlayer){

    roomInput.value =
        savedRoom;

}



/* =================================
   ENTER KEY
================================= */

roomInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            if(
                roomInput.value.trim()
            ){

                setupMessage(
                    "Now select Player 1 or Player 2."
                );

            }

        }

    }
);


</script>


</body>

</html>
