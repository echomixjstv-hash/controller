<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team Quiz Remote</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.screen{
    width:min(720px,96vw);
    height:min(900px,96vh);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

h1{
    margin:0;
    text-align:center;
    font-size:clamp(22px,6vw,38px);
}

.status{
    min-height:24px;
    text-align:center;
    font-size:15px;
    color:#f1c40f;
}

.panel{
    display:flex;
    flex-direction:column;
    gap:14px;
    flex:1;
}

input{
    width:100%;
    border:0;
    outline:0;
    border-radius:14px;
    padding:16px;
    font-size:24px;
    text-align:center;
}

.main-btn{
    width:100%;
    min-height:70px;
    border:0;
    border-radius:16px;
    background:#3498db;
    color:#fff;
    font-size:24px;
    font-weight:bold;
}

.team-select{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.team-btn{
    border:0;
    border-radius:20px;
    color:#fff;
    font-size:clamp(30px,8vw,60px);
    font-weight:bold;
    box-shadow:0 6px 0 #000;
    touch-action:manipulation;
}

.team-a{
    background:#1769ff;
}

.team-b{
    background:#e74c3c;
}

.team-btn:active,
.choice-btn:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #000;
}

.choice-grid{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.choice-btn{
    border:0;
    border-radius:20px;
    background:#333;
    color:#fff;
    font-size:clamp(42px,12vw,82px);
    font-weight:bold;
    box-shadow:0 6px 0 #000;
    touch-action:manipulation;
}

button:disabled{
    opacity:.28;
    pointer-events:none;
}

.hidden{
    display:none !important;
}

.team-name{
    text-align:center;
    font-size:clamp(24px,7vw,42px);
    font-weight:bold;
}

.change-team{
    min-height:50px;
    border:0;
    border-radius:12px;
    background:#555;
    color:white;
    font-size:18px;
    font-weight:bold;
}

@media(max-width:480px){
    .screen{
        width:100%;
        height:100%;
        padding:9px;
        gap:9px;
    }

    .team-select,
    .choice-grid{
        gap:9px;
    }
}
</style>
</head>

<body>

<div class="screen">

    <h1>🏆 TEAM QUIZ REMOTE</h1>

    <div id="status" class="status">
        Enter Room Number
    </div>

    <!-- STEP 1: ROOM NUMBER -->
    <section id="roomScreen" class="panel">

        <input
            id="room"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="ROOM NUMBER">

        <button id="roomBtn" class="main-btn">
            ENTER ROOM
        </button>

    </section>


    <!-- STEP 2: TEAM SELECTION -->
    <section id="teamScreen" class="panel hidden">

        <div class="team-name">
            SELECT YOUR TEAM
        </div>

        <div class="team-select">

            <button
                id="teamA"
                class="team-btn team-a">
                TEAM A
            </button>

            <button
                id="teamB"
                class="team-btn team-b">
                TEAM B
            </button>

        </div>

    </section>


    <!-- STEP 3: CONTROLLER -->
    <section id="controllerScreen" class="panel hidden">

        <div id="selectedTeam" class="team-name">
            TEAM A
        </div>

        <div class="choice-grid">

            <button class="choice-btn" data-command="A">A</button>
            <button class="choice-btn" data-command="B">B</button>
            <button class="choice-btn" data-command="C">C</button>
            <button class="choice-btn" data-command="D">D</button>

        </div>

        <button id="changeTeam" class="change-team">
            CHANGE TEAM
        </button>

    </section>

</div>

<audio id="pressSound" preload="auto">
    <source src="sound.mp3" type="audio/mpeg">
</audio>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
    apiKey:"AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",
    authDomain:"jess-santi.firebaseapp.com",
    databaseURL:"https://jess-santi-default-rtdb.firebaseio.com/",
    projectId:"jess-santi",
    storageBucket:"jess-santi.firebasestorage.app",
    messagingSenderId:"457562056307",
    appId:"1:457562056307:web:1be6c76bc8bdb5bd0aac06",
    measurementId:"G-SKL83F1C8B"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const roomScreen=document.getElementById("roomScreen");
const teamScreen=document.getElementById("teamScreen");
const controllerScreen=document.getElementById("controllerScreen");

const roomInput=document.getElementById("room");
const roomBtn=document.getElementById("roomBtn");

const teamA=document.getElementById("teamA");
const teamB=document.getElementById("teamB");

const selectedTeam=document.getElementById("selectedTeam");
const changeTeam=document.getElementById("changeTeam");

const status=document.getElementById("status");
const sound=document.getElementById("pressSound");

const choiceButtons=
    document.querySelectorAll(".choice-btn");

let roomRef=null;
let roomNumber="";
let selectedTeamValue="";
let currentRound=1;
let localLock=false;


/* =========================================
   STATUS
========================================= */

function setStatus(text,color="#f1c40f"){

    status.textContent=text;
    status.style.color=color;

}


/* =========================================
   STEP 1 — ENTER ROOM
========================================= */

roomBtn.onclick=async function(){

    roomNumber=
        roomInput.value.trim();

    if(!roomNumber){

        setStatus(
            "Please enter the Room Number.",
            "#e74c3c"
        );

        return;
    }

    roomBtn.disabled=true;

    setStatus("Connecting to Room...");

    roomRef=
        db.ref("rooms/"+roomNumber);

    try{

        /*
           Check that Firebase can be reached
           and read the current quiz round.
        */

        const snap=
            await roomRef.child("round").once("value");

        currentRound=
            Number(snap.val()||1);

        roomRef.child("round").on(
            "value",
            snap=>{
                currentRound=
                    Number(snap.val()||1);
            }
        );

        setStatus(
            "Room "+roomNumber+" connected.",
            "#00e676"
        );

        roomScreen.classList.add("hidden");
        teamScreen.classList.remove("hidden");

    }catch(error){

        console.error(error);

        roomBtn.disabled=false;

        setStatus(
            "Could not connect to Firebase.",
            "#e74c3c"
        );
    }

};


/* =========================================
   STEP 2 — SELECT TEAM
========================================= */

async function selectTeam(team){

    if(!roomRef || selectedTeamValue)
        return;

    selectedTeamValue=team;

    /*
       The selected team is stored with the remote
       session. This does not lock the other device's
       team selection.
    */

    selectedTeam.textContent=
        team==="TEAM_A"
        ? "TEAM A"
        : "TEAM B";

    selectedTeam.style.color=
        team==="TEAM_A"
        ? "#4d8dff"
        : "#ff526b";

    teamScreen.classList.add("hidden");
    controllerScreen.classList.remove("hidden");

    setStatus(
        "Connected • "+selectedTeam.textContent,
        "#00e676"
    );

    choiceButtons.forEach(
        button=>button.disabled=false
    );
}

teamA.onclick=()=>{
    selectTeam("TEAM_A");
};

teamB.onclick=()=>{
    selectTeam("TEAM_B");
};


/* =========================================
   STEP 3 — SEND A/B/C/D
========================================= */

async function sendChoice(command){

    if(
        !roomRef ||
        !selectedTeamValue ||
        localLock
    )
        return;

    localLock=true;

    /*
       The 1-second global lock is represented in
       Firebase. The transaction guarantees that only
       the first device to press is accepted.
    */

    choiceButtons.forEach(
        button=>button.disabled=true
    );

    try{

        const remoteRef=
            roomRef.child("remoteButton");

        const result=
            await remoteRef.transaction(
                currentData=>{

                    const now=Date.now();

                    /*
                       Someone already pressed during
                       the 1-second lock.
                    */

                    if(
                        currentData &&
                        Number(
                            currentData.lockUntil||0
                        ) > now
                    ){
                        return;
                    }

                    return {

                        command:command,

                        team:selectedTeamValue,

                        round:currentRound,

                        timestamp:now,

                        lockUntil:
                            now+1000

                    };

                }
            );


        if(result.committed){

            /*
               First accepted press gets the sound.
            */

            sound.currentTime=0;

            try{
                await sound.play();
            }catch(error){
                console.log(
                    "Audio playback blocked:",
                    error
                );
            }

            setStatus(
                "FIRST PRESS: "+
                command+
                " • "+
                (selectedTeamValue==="TEAM_A"
                    ? "TEAM A"
                    : "TEAM B"),
                "#00e676"
            );

        }else{

            /*
               Another remote/device was first.
            */

            setStatus(
                "Another device pressed first.",
                "#f1c40f"
            );
        }


    }catch(error){

        console.error(error);

        setStatus(
            "Firebase send error.",
            "#e74c3c"
        );
    }


    /*
       Exactly 1 second later, all A/B/C/D
       buttons become active again.
    */

    setTimeout(()=>{

        localLock=false;

        choiceButtons.forEach(
            button=>button.disabled=false
        );

    },1000);

}


choiceButtons.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            sendChoice(
                button.dataset.command
            );

        }
    );

});


/* =========================================
   CHANGE TEAM
========================================= */

changeTeam.onclick=function(){

    selectedTeamValue="";

    controllerScreen.classList.add("hidden");
    teamScreen.classList.remove("hidden");

    setStatus(
        "Select your team.",
        "#f1c40f"
    );

};

</script>

</body>
</html>
