<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Team Quiz Controller</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#101010;

    color:white;
}

body{

    display:flex;

    justify-content:center;

    align-items:center;
}

.app{

    width:100%;
    max-width:600px;

    height:100vh;

    padding:18px;

    display:flex;

    flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    text-align:center;

    margin-bottom:15px;
}

.header h1{

    margin:0;

    font-size:30px;
}

.status{

    display:inline-block;

    margin-top:8px;

    padding:7px 15px;

    border-radius:20px;

    background:#555;

    font-size:13px;
}

.status.ok{

    background:#159447;
}

.status.error{

    background:#c0392b;
}


/* =====================================================
   ROOM
===================================================== */

.room-section{

    background:#1d1d1d;

    border-radius:18px;

    padding:18px;

    border:2px solid #333;
}

.room-title{

    text-align:center;

    font-size:16px;

    font-weight:bold;

    margin-bottom:10px;
}

.room-row{

    display:flex;

    gap:8px;
}

#roomInput{

    flex:1;

    min-width:0;

    border:0;

    border-radius:10px;

    padding:14px;

    font-size:20px;

    text-align:center;

    outline:none;
}

#connectBtn{

    border:0;

    border-radius:10px;

    padding:0 18px;

    background:#3498db;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

#connectBtn:active{

    transform:scale(.97);
}

#connectBtn:disabled{

    opacity:.5;
}


/* =====================================================
   TEAM SELECT
===================================================== */

.team-section{

    margin-top:15px;

    display:none;
}

.section-title{

    text-align:center;

    font-size:18px;

    font-weight:bold;

    margin-bottom:10px;
}

.teams{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.team-btn{

    min-height:130px;

    border:4px solid;

    border-radius:18px;

    background:#202020;

    color:white;

    cursor:pointer;

    font-size:26px;

    font-weight:bold;

    transition:.2s;
}

.team-btn:active{

    transform:scale(.96);
}

.team-a{

    border-color:#3498db;
}

.team-b{

    border-color:#e74c3c;
}

.team-btn.unavailable{

    opacity:.18;

    transform:scale(.96);

    pointer-events:none;
}

.team-btn.selected{

    box-shadow:

        0 0 12px currentColor,

        0 0 30px currentColor;

    background:#333;
}

.team-name{

    display:block;

    font-size:28px;
}

.team-status{

    display:block;

    margin-top:8px;

    font-size:13px;

    font-weight:normal;
}


/* =====================================================
   CONTROLLER
===================================================== */

.controller{

    flex:1;

    min-height:0;

    margin-top:15px;

    display:none;

    flex-direction:column;
}

.selected-team{

    text-align:center;

    font-size:22px;

    font-weight:bold;

    margin-bottom:12px;

    padding:10px;

    border-radius:12px;

    background:#1d1d1d;
}


/* =====================================================
   ABCD
===================================================== */

.choice-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:8px;
}

.choice-btn{

    height:75px;

    border:0;

    border-radius:14px;

    background:#303030;

    color:white;

    font-size:30px;

    font-weight:bold;

    cursor:pointer;

    transition:.12s;
}

.choice-btn:active{

    transform:scale(.94);

    background:#555;
}

.choice-btn.active{

    background:#3498db;

    box-shadow:
        0 0 15px rgba(52,152,219,.7);
}


/* =====================================================
   BUZZER
===================================================== */

.buzz-area{

    flex:1;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    padding:15px 0;
}

#buzzBtn{

    width:100%;

    height:100%;

    max-height:300px;

    border:0;

    border-radius:30px;

    background:#c0392b;

    color:white;

    font-size:60px;

    font-weight:900;

    cursor:pointer;

    box-shadow:

        0 8px 0 #7f1d1d,

        0 15px 30px rgba(0,0,0,.5);

    transition:.08s;
}

#buzzBtn:active{

    transform:translateY(8px);

    box-shadow:

        0 0 0 #7f1d1d,

        0 8px 20px rgba(0,0,0,.5);
}

#buzzBtn.sent{

    background:#27ae60;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:25px;

    text-align:center;

    font-size:15px;

    font-weight:bold;

    margin-top:5px;
}

.hidden{

    display:none!important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:450px){

    .app{

        padding:10px;
    }

    .header h1{

        font-size:24px;
    }

    .team-btn{

        min-height:110px;

        font-size:21px;
    }

    .team-name{

        font-size:23px;
    }

    .choice-btn{

        height:65px;

        font-size:25px;
    }

    #buzzBtn{

        font-size:45px;

        border-radius:25px;
    }
}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">

        <h1>🎮 QUIZ CONTROLLER</h1>

        <div id="status"
             class="status">

            Enter Room Number

        </div>

    </div>


    <!-- =================================================
         ROOM
    ================================================= -->

    <div id="roomSection"
         class="room-section">

        <div class="room-title">

            ENTER ROOM NUMBER

        </div>

        <div class="room-row">

            <input
                id="roomInput"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ROOM NUMBER">

            <button id="connectBtn">

                CONNECT

            </button>

        </div>

    </div>


    <!-- =================================================
         TEAM SELECT
    ================================================= -->

    <div id="teamSection"
         class="team-section">

        <div class="section-title">

            SELECT TEAM

        </div>


        <div class="teams">


            <!-- TEAM A -->

            <button
                id="teamABtn"
                class="team-btn team-a">

                <span class="team-name">

                    🔵 TEAM A

                </span>

                <span
                    id="teamAStatus"
                    class="team-status">

                    Available

                </span>

            </button>


            <!-- TEAM B -->

            <button
                id="teamBBtn"
                class="team-btn team-b">

                <span class="team-name">

                    🔴 TEAM B

                </span>

                <span
                    id="teamBStatus"
                    class="team-status">

                    Available

                </span>

            </button>

        </div>

    </div>


    <!-- =================================================
         CONTROLLER
    ================================================= -->

    <div id="controller"
         class="controller">


        <div id="selectedTeam"
             class="selected-team">

        </div>


        <!-- ABCD -->

        <div class="choice-grid">


            <button
                class="choice-btn"
                data-choice="A">

                A

            </button>


            <button
                class="choice-btn"
                data-choice="B">

                B

            </button>


            <button
                class="choice-btn"
                data-choice="C">

                C

            </button>


            <button
                class="choice-btn"
                data-choice="D">

                D

            </button>


        </div>


        <!-- BUZZ -->

        <div class="buzz-area">

            <button id="buzzBtn">

                BUZZ

            </button>

        </div>


        <div id="message"
             class="message">

        </div>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAKzNpDBeiT-eymm0e1l_U3p_dggPrbEk",

    authDomain:
        "jess-santi.firebaseapp.com",

    databaseURL:
        "https://jess-santi-default-rtdb.firebaseio.com/",

    projectId:
        "jess-santi",

    storageBucket:
        "jess-santi.firebasestorage.app",

    messagingSenderId:
        "457562056307",

    appId:
        "1:457562056307:web:1be6c76bc8bdb5bd0aac06",

    measurementId:
        "G-SKL83F1C8B"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =====================================================
   VARIABLES
===================================================== */

let roomNumber = "";

let roomRef = null;

let selectedTeam = "";

let connected = false;

let teamListener = null;

let presenceRef = null;


/*
   Unique ID ng controller.

   Ito ang ginagamit para malaman
   kung ibang device ang gumagamit.
*/

const controllerId =
    "controller_" +
    Date.now() +
    "_" +
    Math.random()
        .toString(36)
        .substring(2,10);


/* =====================================================
   ELEMENTS
===================================================== */

const roomInput =
    document.getElementById(
        "roomInput"
    );

const connectBtn =
    document.getElementById(
        "connectBtn"
    );

const status =
    document.getElementById(
        "status"
    );

const roomSection =
    document.getElementById(
        "roomSection"
    );

const teamSection =
    document.getElementById(
        "teamSection"
    );

const controller =
    document.getElementById(
        "controller"
    );

const teamABtn =
    document.getElementById(
        "teamABtn"
    );

const teamBBtn =
    document.getElementById(
        "teamBBtn"
    );

const teamAStatus =
    document.getElementById(
        "teamAStatus"
    );

const teamBStatus =
    document.getElementById(
        "teamBStatus"
    );

const selectedTeamText =
    document.getElementById(
        "selectedTeam"
    );

const buzzBtn =
    document.getElementById(
        "buzzBtn"
    );

const message =
    document.getElementById(
        "message"
    );


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    type=""
){

    status.innerText = text;

    status.classList.remove(
        "ok",
        "error"
    );

    if(type){

        status.classList.add(
            type
        );

    }

}


/* =====================================================
   CONNECT ROOM
===================================================== */

connectBtn.onclick =
async function(){

    const room =
        roomInput.value.trim();


    if(!room){

        setStatus(
            "Enter Room Number",
            "error"
        );

        return;

    }


    connectBtn.disabled = true;

    setStatus(
        "Checking Room..."
    );


    try{

        const ref =
            db.ref(
                "rooms/" + room
            );


        /*
           Existing room lamang.
        */

        const snap =
            await ref.once(
                "value"
            );


        if(!snap.exists()){

            setStatus(
                "❌ Room Not Found",
                "error"
            );

            connectBtn.disabled = false;

            return;

        }


        roomNumber = room;

        roomRef = ref;

        connected = true;


        setStatus(
            "✓ ROOM CONNECTED: " + room,
            "ok"
        );


        roomInput.disabled = true;

        connectBtn.innerText =
            "CONNECTED";


        /*
           Hide room section.
        */

        roomSection.style.display =
            "none";


        /*
           Show TEAM A / TEAM B.
        */

        teamSection.style.display =
            "block";


        listenTeams();


    }catch(error){

        console.error(error);

        setStatus(
            "❌ Connection Error",
            "error"
        );

        connectBtn.disabled = false;

    }

};


/* =====================================================
   TEAM AVAILABILITY
===================================================== */

function listenTeams(){

    if(!roomRef)
        return;


    if(teamListener){

        roomRef
            .child("controllers")
            .off(
                "value",
                teamListener
            );

    }


    teamListener =
    function(snap){

        const data =
            snap.val() || {};


        updateTeamButton(
            teamABtn,
            teamAStatus,
            data.teamA
        );


        updateTeamButton(
            teamBBtn,
            teamBStatus,
            data.teamB
        );

    };


    roomRef
        .child("controllers")
        .on(
            "value",
            teamListener
        );

}


/* =====================================================
   UPDATE TEAM BUTTON
===================================================== */

function updateTeamButton(
    button,
    statusElement,
    data
){

    /*
       Walang gumagamit.
    */

    if(!data){

        button.classList.remove(
            "unavailable"
        );

        statusElement.innerText =
            "Available";

        return;

    }


    /*
       Sariling controller natin.
       Dapat available pa rin sa UI.
    */

    if(
        data.id === controllerId &&
        selectedTeam
    ){

        button.classList.remove(
            "unavailable"
        );

        statusElement.innerText =
            "YOU";

        return;

    }


    /*
       May ibang device.
    */

    button.classList.add(
        "unavailable"
    );

    statusElement.innerText =
        "IN USE";

}


/* =====================================================
   TEAM BUTTONS
===================================================== */

teamABtn.onclick =
function(){

    selectTeam(
        "A"
    );

};


teamBBtn.onclick =
function(){

    selectTeam(
        "B"
    );

};


/* =====================================================
   CLAIM TEAM
===================================================== */

async function selectTeam(
    team
){

    if(
        !connected ||
        !roomRef
    )
        return;


    if(selectedTeam)
        return;


    const teamKey =
        team === "A"
            ? "teamA"
            : "teamB";


    const teamRef =
        roomRef
            .child("controllers")
            .child(teamKey);


    try{


        /*
           TRANSACTION

           Tinitiyak nito na isang device
           lamang ang makakakuha ng team.
        */

        const result =
            await teamRef.transaction(
                current => {

                    if(current !== null){

                        return;

                    }


                    return {

                        id:
                            controllerId,

                        connected:
                            true,

                        team:
                            team,

                        at:
                            firebase.database
                            .ServerValue
                            .TIMESTAMP

                    };

                }
            );


        /*
           May ibang device nang gumagamit.
        */

        if(!result.committed){

            message.innerText =
                "❌ Team " +
                team +
                " is already in use.";

            return;

        }


        /*
           Successful.
        */

        selectedTeam = team;


        /*
           Setup presence.
        */

        startPresence();


        /*
           Hide team selection.
        */

        teamSection.style.display =
            "none";


        /*
           Show controller.
        */

        controller.style.display =
            "flex";


        if(team === "A"){

            selectedTeamText.innerText =
                "🔵 TEAM A";

        }else{

            selectedTeamText.innerText =
                "🔴 TEAM B";

        }


        message.innerText =
            "Controller Ready";


    }catch(error){

        console.error(error);

        message.innerText =
            "Unable to select team.";

    }

}


/* =====================================================
   PRESENCE
===================================================== */

function startPresence(){

    if(
        !roomRef ||
        !selectedTeam
    )
        return;


    const teamKey =
        selectedTeam === "A"
            ? "teamA"
            : "teamB";


    presenceRef =
        roomRef
            .child("controllers")
            .child(teamKey);


    /*
       Kapag nawala ang connection,
       Firebase mismo ang mag-aalis
       ng controller.
    */

    presenceRef
        .onDisconnect()
        .remove();


    presenceRef.update({

        id:
            controllerId,

        connected:
            true,

        team:
            selectedTeam,

        at:
            firebase.database
            .ServerValue
            .TIMESTAMP

    });

}


/* =====================================================
   SEND COMMAND
===================================================== */

async function sendCommand(
    command
){

    if(
        !connected ||
        !roomRef ||
        !selectedTeam
    ){

        message.innerText =
            "Controller not ready.";

        return;

    }


    try{


        await roomRef
            .child("remoteButton")
            .set({

                /*
                   Command
                */

                command:
                    command,


                /*
                   TEAM A or TEAM B
                */

                team:
                    selectedTeam,


                /*
                   Unique controller
                */

                controller:
                    controllerId,


                /*
                   Timestamp
                */

                timestamp:
                    firebase.database
                    .ServerValue
                    .TIMESTAMP

            });


    }catch(error){

        console.error(error);

        message.innerText =
            "Command failed.";

    }

}


/* =====================================================
   ABCD BUTTONS
===================================================== */

document
.querySelectorAll(
    ".choice-btn"
)
.forEach(
    button => {

        button.onclick =
        function(){

            const choice =
                button.dataset.choice;


            /*
               Send command.
            */

            sendCommand(
                choice
            );


            /*
               Visual feedback.
            */

            button.classList.add(
                "active"
            );


            setTimeout(
                () => {

                    button.classList.remove(
                        "active"
                    );

                },
                150
            );

        };

    }
);


/* =====================================================
   BUZZER
===================================================== */

let buzzLocked = false;


buzzBtn.onclick =
function(){

    if(
        !connected ||
        !selectedTeam
    )
        return;


    /*
       Local debounce lamang.
    */

    if(buzzLocked)
        return;


    buzzLocked = true;


    /*
       IMPORTANT:

       TEAM A -> TEAM_A
       TEAM B -> TEAM_B

       Hindi na PLAYER 1 / PLAYER 2.
    */

    sendCommand(
        "BUZZ"
    );


    buzzBtn.classList.add(
        "sent"
    );


    buzzBtn.innerText =
        "BUZZED!";


    setTimeout(
        () => {

            buzzLocked = false;

            buzzBtn.classList.remove(
                "sent"
            );

            buzzBtn.innerText =
                "BUZZ";

        },
        300
    );

};


/* =====================================================
   KEYBOARD
=====================================================

   Z = A
   X = B
   C = C
   V = D
   SPACE = BUZZ

===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(!selectedTeam)
            return;


        const key =
            event.key.toLowerCase();


        const map = {

            z:"A",

            x:"B",

            c:"C",

            v:"D"

        };


        /*
           ABCD
        */

        if(map[key]){

            event.preventDefault();


            sendCommand(
                map[key]
            );


            const button =
                document.querySelector(
                    `[data-choice="${map[key]}"]`
                );


            if(button){

                button.classList.add(
                    "active"
                );


                setTimeout(
                    () => {

                        button.classList.remove(
                            "active"
                        );

                    },
                    150
                );

            }

        }


        /*
           SPACE = BUZZ
        */

        if(event.code === "Space"){

            event.preventDefault();

            buzzBtn.click();

        }

    }
);


/* =====================================================
   FIREBASE CONNECTION
===================================================== */

db.ref(
    ".info/connected"
)
.on(
    "value",
    snap => {

        if(snap.val()){

            console.log(
                "Firebase connection active"
            );

        }

    }
);


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        /*
           Hindi kailangang manual
           mag-remove dito.

           onDisconnect() ang bahala.
        */

        if(presenceRef){

            presenceRef
                .onDisconnect()
                .remove();

        }

    }
);


/* =====================================================
   ENTER KEY FOR ROOM
===================================================== */

roomInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            connectBtn.click();

        }

    }
);

</script>

</body>
</html>
