<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Quiz Remote</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#101010;

    color:white;
}


button{
    -webkit-user-select:none;
    user-select:none;
}


/* =====================================================
   SETUP SCREEN
===================================================== */

#setupScreen{

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:20px;

    text-align:center;
}


.logo{

    font-size:32px;

    font-weight:900;

    margin-bottom:30px;
}


.roomLabel{

    font-size:16px;

    color:#aaa;

    margin-bottom:10px;
}


#roomInput{

    width:100%;

    max-width:380px;

    height:65px;

    border:0;

    outline:none;

    border-radius:14px;

    background:#252525;

    color:white;

    text-align:center;

    font-size:30px;

    font-weight:bold;

    margin-bottom:25px;
}


.playerLabel{

    color:#aaa;

    margin-bottom:12px;
}


.playerButtons{

    width:100%;

    max-width:380px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    transition:.3s;
}


.playerButton{

    height:80px;

    border:0;

    border-radius:16px;

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 0 rgba(0,0,0,.5);

    transition:
        opacity .25s,
        transform .15s,
        width .25s;
}


.playerButton:active{

    transform:translateY(6px);

    box-shadow:none;
}


.player1Button{

    background:#3498db;
}


.player2Button{

    background:#e74c3c;
}


.playerButton.hidden{

    display:none;
}


.setupStatus{

    margin-top:20px;

    min-height:20px;

    color:#888;

    font-size:14px;
}


.roomFull{

    color:#ff5252 !important;

    font-weight:bold;

}



/* =====================================================
   REMOTE SCREEN
===================================================== */

#remoteScreen{

    width:100%;

    height:100vh;

    display:none;

    flex-direction:column;

    padding:12px;
}



/* =====================================================
   HEADER
===================================================== */

.header{

    height:45px;

    flex-shrink:0;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;
}


.playerName{

    font-size:25px;

    font-weight:900;
}


.roomName{

    color:#888;

    font-size:12px;

    margin-top:3px;
}



/* =====================================================
   ABCD
===================================================== */

.answers{

    width:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    flex-shrink:0;
}


.answer{

    height:80px;

    border:0;

    border-radius:16px;

    color:white;

    font-size:40px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 6px 0 rgba(0,0,0,.6);

    transition:
        transform .05s,
        box-shadow .05s;
}


.answer:active{

    transform:translateY(6px);

    box-shadow:none;
}


#a{

    background:#c62828;
}


#b{

    background:#1565c0;
}


#c{

    background:#2e7d32;
}


#d{

    background:#ef6c00;
}



/* =====================================================
   BUZZ
===================================================== */

.buzzArea{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px 0 8px;
}


#buzzButton{

    width:100%;

    height:100%;

    max-height:350px;

    border:0;

    border-radius:35px;

    background:#d50000;

    color:white;

    font-size:55px;

    font-weight:1000;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 12px 0 #750000,
        inset 0 0 30px rgba(255,255,255,.12);
}


#buzzButton:active{

    transform:translateY(12px);

    box-shadow:
        0 0 0 #750000;
}



/* =====================================================
   STATUS
===================================================== */

.status{

    height:28px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#888;

    font-size:13px;
}


.status.connected{

    color:#00e676;
}


.status.error{

    color:#ff5252;
}



/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-height:600px){

    .header{

        height:40px;
    }


    .answer{

        height:62px;

        font-size:32px;
    }


    #buzzButton{

        font-size:42px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SETUP SCREEN
===================================================== -->

<div id="setupScreen">


    <div class="logo">

        🎮 QUIZ REMOTE

    </div>


    <div class="roomLabel">

        ROOM NUMBER

    </div>


    <input
        id="roomInput"
        type="tel"
        inputmode="numeric"
        placeholder="ROOM #"
        autocomplete="off"
    >


    <div class="playerLabel">

        SELECT PLAYER

    </div>


    <div
        id="playerButtons"
        class="playerButtons"
    >


        <button
            id="player1Button"
            class="playerButton player1Button"
            onclick="selectPlayer(1)"
        >

            🔵 PLAYER 1

        </button>


        <button
            id="player2Button"
            class="playerButton player2Button"
            onclick="selectPlayer(2)"
        >

            🔴 PLAYER 2

        </button>


    </div>


    <div
        id="setupStatus"
        class="setupStatus"
    >

        Enter room number

    </div>


</div>



<!-- =====================================================
     REMOTE SCREEN
===================================================== -->

<div id="remoteScreen">


    <div class="header">

        <div>

            <div
                id="playerName"
                class="playerName"
            >
                PLAYER 1
            </div>


            <div
                id="roomName"
                class="roomName"
            >
                ROOM
            </div>

        </div>

    </div>



    <!-- =================================================
         ABCD
    ================================================== -->

    <div class="answers">


        <button
            id="a"
            class="answer"
            onclick="sendAnswer('A')"
        >
            A
        </button>


        <button
            id="b"
            class="answer"
            onclick="sendAnswer('B')"
        >
            B
        </button>


        <button
            id="c"
            class="answer"
            onclick="sendAnswer('C')"
        >
            C
        </button>


        <button
            id="d"
            class="answer"
            onclick="sendAnswer('D')"
        >
            D
        </button>


    </div>



    <!-- =================================================
         BUZZ
    ================================================== -->

    <div class="buzzArea">


        <button
            id="buzzButton"
            onclick="sendBuzz()"
        >

            BUZZ!

        </button>


    </div>



    <div
        id="status"
        class="status"
    >

        Ready

    </div>


</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

    apiKey:
        "AIzaSyAKzNpD9BeiT-eymm0e1l_U3p_dggPrbEk",

    authDomain:
        "jess-santi.firebaseapp.com",

    databaseURL:
        "https://jess-santi-default-rtdb.firebaseio.com/",

    projectId:
        "jess-santi",

    storageBucket:
        "jess-santi.firebasestorage.app",

    messagingSenderId:
        "457562056307",

    appId:
        "1:457562056307:web:1be6c76bc8bdb5bd0aac06",

    measurementId:
        "G-SKL83F1C8B"

};


firebase.initializeApp(
    firebaseConfig
);


const db=
    firebase.database();



/* =====================================================
   VARIABLES
===================================================== */

let roomNumber="";

let playerNumber=0;

let playerNameValue="";

let roomRef=null;

let playerRef=null;

let connected=false;



/* =====================================================
   ELEMENTS
===================================================== */

const setupScreen=
    document.getElementById(
        "setupScreen"
    );


const remoteScreen=
    document.getElementById(
        "remoteScreen"
    );


const roomInput=
    document.getElementById(
        "roomInput"
    );


const setupStatus=
    document.getElementById(
        "setupStatus"
    );


const player1Button=
    document.getElementById(
        "player1Button"
    );


const player2Button=
    document.getElementById(
        "player2Button"
    );


const playerName=
    document.getElementById(
        "playerName"
    );


const roomName=
    document.getElementById(
        "roomName"
    );


const status=
    document.getElementById(
        "status"
    );


const buzzButton=
    document.getElementById(
        "buzzButton"
    );



/* =====================================================
   CHECK PLAYERS
===================================================== */

function listenPlayers(){

    if(!roomRef)
        return;


    roomRef
    .child("remote")
    .on(
        "value",
        snap=>{

            const players=
                snap.val() || {};


            const player1=
                players.player1;


            const player2=
                players.player2;


            /*
               PLAYER 1
            */

            if(
                player1 &&
                player1.online===true
            ){

                player1Button.classList.add(
                    "hidden"
                );

            }
            else{

                player1Button.classList.remove(
                    "hidden"
                );

            }


            /*
               PLAYER 2
            */

            if(
                player2 &&
                player2.online===true
            ){

                player2Button.classList.add(
                    "hidden"
                );

            }
            else{

                player2Button.classList.remove(
                    "hidden"
                );

            }


            /*
               BOTH OCCUPIED
            */

            if(
                player1 &&
                player1.online===true &&
                player2 &&
                player2.online===true
            ){

                setupStatus.innerText=
                    "ROOM FULL — BOTH PLAYERS ARE CONNECTED";

                setupStatus.classList.add(
                    "roomFull"
                );

            }
            else{

                /*
                   Don't overwrite the message
                   if remote is already open.
                */

                if(
                    setupScreen.style.display!=="none"
                ){

                    setupStatus.innerText=
                        "Select an available player.";

                    setupStatus.classList.remove(
                        "roomFull"
                    );

                }

            }

        }
    );

}



/* =====================================================
   SELECT PLAYER
===================================================== */

window.selectPlayer=
async function(player){

    const room=
        roomInput.value.trim();


    if(!room){

        setupStatus.innerText=
            "Enter room number first.";

        setupStatus.style.color=
            "#ff5252";

        return;

    }


    roomNumber=room;


    playerNameValue=
        player===1
        ? "player1"
        : "player2";


    roomRef=
        db.ref(
            "rooms/"+roomNumber
        );


    /*
       Reference for this exact player.
    */

    playerRef=
        roomRef
        .child("remote")
        .child(playerNameValue);


    try{

        /*
           Check if player is already occupied.
        */

        const snap=
            await playerRef.once(
                "value"
            );


        const existing=
            snap.val();


        if(
            existing &&
            existing.online===true
        ){

            setupStatus.innerText=
                "PLAYER "+
                player+
                " is already connected.";

            setupStatus.style.color=
                "#ff5252";

            return;

        }


        /*
           Mark player online.
        */

        await playerRef.set({

            online:true,

            connectedAt:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });


        /*
           VERY IMPORTANT:

           If browser closes,
           phone disconnects,
           tab crashes,
           or internet connection drops,

           Firebase automatically changes
           online to false.
        */

        playerRef
        .onDisconnect()
        .set({

            online:false,

            disconnectedAt:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });


        connected=true;

        playerNumber=player;


        /*
           Save room only.
        */

        localStorage.setItem(
            "quizRemoteRoom",
            roomNumber
        );


        openRemote();


    }
    catch(error){

        console.error(error);

        setupStatus.innerText=
            "Firebase connection failed.";

        setupStatus.style.color=
            "#ff5252";

    }

};



/* =====================================================
   OPEN REMOTE
===================================================== */

function openRemote(){

    setupScreen.style.display=
        "none";


    remoteScreen.style.display=
        "flex";


    playerName.innerText=
        playerNumber===1
        ? "🔵 PLAYER 1"
        : "🔴 PLAYER 2";


    roomName.innerText=
        "ROOM "+roomNumber;


    if(playerNumber===1){

        playerName.style.color=
            "#42a5f5";

    }
    else{

        playerName.style.color=
            "#ef5350";

    }


    status.innerText=
        "Firebase: Connected";


    status.className=
        "status connected";

}



/* =====================================================
   BUZZ
===================================================== */

window.sendBuzz=
async function(){

    if(!connected || !roomRef)
        return;


    try{

        /*
           NO ROUND
           NO STATE
           NO PHASE
        */

        await roomRef
        .child("buzzer")
        .set({

            player:
                playerNameValue,

            timestamp:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });


        buzzButton.innerText=
            "BUZZ SENT";


        buzzButton.style.background=
            "#555";


        status.innerText=
            "BUZZ SENT";


        setTimeout(()=>{

            buzzButton.innerText=
                "BUZZ!";

            buzzButton.style.background=
                "#d50000";

            status.innerText=
                "Ready";

        },500);

    }
    catch(error){

        console.error(error);

        status.innerText=
            "Firebase Error";

        status.className=
            "status error";

    }

};



/* =====================================================
   ANSWER
===================================================== */

window.sendAnswer=
async function(answer){

    if(!connected || !roomRef)
        return;


    try{

        /*
           NO ROUND
           NO STATE
           NO PHASE
        */

        await roomRef
        .child("answer")
        .set({

            player:
                playerNameValue,

            answer:
                answer,

            timestamp:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });


        status.innerText=
            "ANSWER "+
            answer+
            " SENT";


        status.className=
            "status connected";


        setTimeout(()=>{

            status.innerText=
                "Ready";

        },500);

    }
    catch(error){

        console.error(error);

        status.innerText=
            "Firebase Error";

        status.className=
            "status error";

    }

};



/* =====================================================
   FIREBASE CONNECTION
===================================================== */

db.ref(".info/connected")
.on(
    "value",
    snap=>{

        if(
            snap.val()===true &&
            connected
        ){

            status.innerText=
                "Firebase: Connected";

            status.className=
                "status connected";

        }


        if(
            snap.val()===false &&
            connected
        ){

            status.innerText=
                "Firebase: Disconnected";

            status.className=
                "status error";

        }

    }
);



/* =====================================================
   RESTORE ROOM
===================================================== */

const savedRoom=
    localStorage.getItem(
        "quizRemoteRoom"
    );


if(savedRoom){

    roomInput.value=
        savedRoom;

}


/* =====================================================
   ROOM INPUT
===================================================== */

roomInput.addEventListener(
    "input",
    function(){

        /*
           Every time the room changes,
           check available players.
        */

        const room=
            roomInput.value.trim();


        if(!room)
            return;


        roomRef=
            db.ref(
                "rooms/"+room
            );


        listenPlayers();

    }
);



/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        const key=
            event.key.toLowerCase();


        /*
           Z = A
           X = B
           C = C
           V = D
        */

        if(key==="z"){

            sendAnswer("A");

        }

        else if(key==="x"){

            sendAnswer("B");

        }

        else if(key==="c"){

            sendAnswer("C");

        }

        else if(key==="v"){

            sendAnswer("D");

        }


        /*
           SPACE = BUZZ
        */

        else if(
            event.code==="Space"
        ){

            event.preventDefault();

            sendBuzz();

        }

    }
);

</script>

</body>

</html>
