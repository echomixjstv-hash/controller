<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Remote Button Controller</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.controller{
    width:min(700px,96vw);
    height:min(850px,96vh);
    display:flex;
    flex-direction:column;
    gap:15px;
    padding:15px;
}

.title{
    color:white;
    text-align:center;
    font-size:clamp(20px,5vw,34px);
    font-weight:bold;
}

.status{
    text-align:center;
    color:#00ff66;
    font-size:16px;
    min-height:22px;
}

.team-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    flex:1;
}

.choice-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    flex:1.5;
}

button{
    border:0;
    border-radius:20px;
    font-size:clamp(32px,9vw,70px);
    font-weight:bold;
    color:white;
    background:#222;
    box-shadow:
        0 5px 0 #000,
        inset 0 0 15px rgba(255,255,255,.08);
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    transition:.08s;
}

button:active{
    transform:translateY(5px);
    box-shadow:0 0 0 #000;
}

.team1{
    background:#1769ff;
}

.team2{
    background:#e91e63;
}

.choice{
    background:#333;
}

button.locked{
    opacity:.25;
    pointer-events:none;
}

button.active{
    transform:scale(.97);
}

@media(max-width:500px){

    .controller{
        width:100%;
        height:100%;
        padding:10px;
        gap:10px;
    }

    button{
        border-radius:15px;
    }

}

</style>
</head>

<body>

<div class="controller">

    <div class="title">
        REMOTE CONTROLLER
    </div>

    <div class="status" id="status">
        CONNECTING...
    </div>

    <div class="team-row">

        <button
            class="team1"
            data-command="TEAM1">
            TEAM 1
        </button>

        <button
            class="team2"
            data-command="TEAM2">
            TEAM 2
        </button>

    </div>

    <div class="choice-row">

        <button
            class="choice"
            data-command="A">
            A
        </button>

        <button
            class="choice"
            data-command="B">
            B
        </button>

        <button
            class="choice"
            data-command="C">
            C
        </button>

        <button
            class="choice"
            data-command="D">
            D
        </button>

    </div>

</div>

<audio id="pressSound" preload="auto">
    <source src="sound.mp3" type="audio/mpeg">
</audio>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey: "...",

    authDomain:
        "jess-santi.firebaseapp.com",

    databaseURL:
        "https://jess-santi-default-rtdb.firebaseio.com/",

    projectId:
        "jess-santi",

    storageBucket:
        "jess-santi.firebasestorage.app",

    messagingSenderId:
        "457562056307",

    appId:
        "1:457562056307:web:1be6c76bc8bdb5bd0aac06"

};


/* ==========================================
   FIREBASE
========================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* ==========================================
   DATABASE LOCATION
========================================== */

const buttonRef =
    ref(db,"remoteButton");


/* ==========================================
   ELEMENTS
========================================== */

const buttons =
    document.querySelectorAll("button");

const status =
    document.getElementById("status");

const pressSound =
    document.getElementById("pressSound");


/* ==========================================
   LOCAL UI LOCK
========================================== */

let localLock = false;


/* ==========================================
   FIREBASE CONNECTION
========================================== */

status.textContent =
    "CONNECTED";

status.style.color =
    "#00ff66";


/* ==========================================
   DISABLE ALL BUTTONS
========================================== */

function lockButtons(){

    buttons.forEach(button => {
        button.classList.add("locked");
    });

}


/* ==========================================
   ENABLE ALL BUTTONS
========================================== */

function unlockButtons(){

    buttons.forEach(button => {
        button.classList.remove("locked");
    });

}


/* ==========================================
   SEND BUTTON
========================================== */

async function sendButton(command){

    if(localLock)
        return;

    localLock = true;

    lockButtons();


    /*
       Firebase transaction ang ginagamit
       para isang device lang ang makakuha
       ng first press.
    */

    try{

        const result =
            await runTransaction(
                buttonRef,
                currentData => {

                    const now =
                        Date.now();

                    /*
                       Kung may active lock pa,
                       huwag tanggapin ang press.
                    */

                    if(
                        currentData &&
                        currentData.lockUntil &&
                        now < currentData.lockUntil
                    ){

                        return;

                    }


                    /*
                       First valid press.
                    */

                    return {

                        command:command,

                        timestamp:now,

                        lockUntil:
                            now + 1000

                    };

                }
            );


        /*
           Kung successful ang transaction,
           ibig sabihin accepted ang press.
        */

        if(result.committed){

            const data =
                result.snapshot.val();

            /*
               Sound lamang para sa
               successful first press.
            */

            if(
                data &&
                data.command === command
            ){

                try{

                    pressSound.currentTime = 0;

                    await pressSound.play();

                }catch(error){

                    console.log(
                        "Sound playback blocked:",
                        error
                    );

                }

            }

        }


    }catch(error){

        console.error(
            "Firebase error:",
            error
        );

        status.textContent =
            "CONNECTION ERROR";

        status.style.color =
            "red";

    }


    /*
       1 second local lock.
    */

    setTimeout(() => {

        localLock = false;

        unlockButtons();

    },1000);

}


/* ==========================================
   BUTTON EVENTS
========================================== */

buttons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const command =
                button.dataset.command;

            sendButton(command);

        }
    );

});


</script>

</body>
</html>
